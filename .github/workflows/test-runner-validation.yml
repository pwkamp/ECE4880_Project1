name: Test runner validation

on:
  pull_request:
  push:

jobs:
  python-validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Prepare test artifact directory
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tests/results/ci | Out-Null
          @(
            "run_id=$env:GITHUB_RUN_ID"
            "run_attempt=$env:GITHUB_RUN_ATTEMPT"
            "commit=$env:GITHUB_SHA"
          ) | Set-Content -Encoding utf8 tests/results/ci/workflow.txt
      - name: Install test dependencies
        if: ${{ !cancelled() }}
        run: python -m pip install -r backend/pc_client/requirements-dev.txt
      - name: Validate frozen traceability
        if: ${{ !cancelled() }}
        run: python -m tests.runner validate
      - name: Validate generated scaffolds
        if: ${{ !cancelled() }}
        run: python -m tests._framework.scaffold --check
      - name: Run all active Python unit tests
        if: ${{ !cancelled() }}
        run: python master_test.py
      - name: Run consolidated protocol unit test
        if: ${{ !cancelled() }}
        run: python -m tests.runner run --profile unit --test BLE-005 --executor "GitHub Actions"
      - name: Upload immutable test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thermometer-test-evidence
          path: tests/results/
          if-no-files-found: error
