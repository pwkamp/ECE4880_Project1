  {
    "uid": "PRJ-REQ-004",
    "jira": "SCRUM-402",
    "level": "Project",
    "component": "System",
    "status": "active",
    "parents": [],
    "text": "Ambiguous or conflicting stakeholder requirements shall be clarified before the affected design is finalized.",
    "jira_summary": "PRJ-REQ-004 - Requirements Clarification",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-402",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SYS-HLR-100",
    "jira": "SCRUM-403",
    "level": "HLR",
    "component": "System",
    "status": "active",
    "parents": [],
    "text": "The system shall consist of a computer, two temperature-sensor assemblies, a battery-operated third-box assembly, and support for delivery of email alerts to one or more receiving addresses. SMS/text-message delivery is out of scope.",
    "jira_summary": "SYS-HLR-100 - System Composition",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-403",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SYS-HLR-110",
    "jira": "SCRUM-404",
    "level": "HLR",
    "component": "System",
    "status": "active",
    "parents": [],
    "text": "Temperature information produced by the third-box thermometer shall be accessible through an internet-connected computer while the required system components are operational.",
    "jira_summary": "SYS-HLR-110 - Internet-Accessible Temperature Data",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-404",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SYS-HLR-200",
    "jira": "SCRUM-405",
    "level": "HLR",
    "component": "System",
    "status": "active",
    "parents": [],
    "text": "The sensor assemblies, third box, cables, controls, and connectors shall satisfy the stakeholder-specified physical construction, handling, drop, and connection requirements.",
    "jira_summary": "SYS-HLR-200 - Physical and Mechanical Robustness",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-405",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SYS-HLR-210",
    "jira": "SCRUM-406",
    "level": "HLR",
    "component": "System",
    "status": "active",
    "parents": [],
    "text": "The system shall tolerate temperature-sensor disconnection and reconnection without requiring user intervention to restore normal operation.",
    "jira_summary": "SYS-HLR-210 - Sensor Hot-Plug Recovery",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-406",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SYS-HLR-220",
    "jira": "SCRUM-407",
    "level": "HLR",
    "component": "System",
    "status": "active",
    "parents": [],
    "text": "The third-box power switch shall control availability of local thermometer functionality and current remotely accessible temperature data.",
    "jira_summary": "SYS-HLR-220 - Third-Box Power Control",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-407",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SYS-HLR-300",
    "jira": "SCRUM-408",
    "level": "HLR",
    "component": "System",
    "status": "active",
    "parents": [],
    "text": "The system design shall support temperatures from at least -10 deg C through +63 deg C.",
    "jira_summary": "SYS-HLR-300 - Temperature Design Range",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-408",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SYS-HLR-310",
    "jira": "SCRUM-409",
    "level": "HLR",
    "component": "System",
    "status": "active",
    "parents": [],
    "text": "The temperature-measurement system shall visibly respond to sensor heating under the stakeholder-specified hand and soldering-iron tests.",
    "jira_summary": "SYS-HLR-310 - Thermal Response",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-409",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SYS-HLR-320",
    "jira": "SCRUM-410",
    "level": "HLR",
    "component": "System",
    "status": "active",
    "parents": [],
    "text": "The thermometer shall satisfy the specified room-temperature and ice-water measurement tolerances.",
    "jira_summary": "SYS-HLR-320 - Temperature Accuracy",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-410",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SYS-HLR-400",
    "jira": "SCRUM-411",
    "level": "HLR",
    "component": "System",
    "status": "active",
    "parents": [],
    "text": "When powered ON, the third box shall display temperature information according to the independently controlled display state of Sensor 1 and Sensor 2.",
    "jira_summary": "SYS-HLR-400 - Local Temperature Display and Controls",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-411",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SYS-HLR-410",
    "jira": "SCRUM-412",
    "level": "HLR",
    "component": "System",
    "status": "active",
    "parents": [],
    "text": "The third-box display shall present correct temperature information with the required response time and indoor readability.",
    "jira_summary": "SYS-HLR-410 - Local Display Performance",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-412",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SYS-HLR-420",
    "jira": "SCRUM-413",
    "level": "HLR",
    "component": "System",
    "status": "active",
    "parents": [],
    "text": "The third box shall notify the local user when a temperature sensor is disconnected or otherwise malfunctioning.",
    "jira_summary": "SYS-HLR-420 - Local Sensor Fault Indication",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-413",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SYS-HLR-500",
    "jira": "SCRUM-414",
    "level": "HLR",
    "component": "System",
    "status": "active",
    "parents": [],
    "text": "When the computer software and third box are operational, the system shall provide remotely accessible real-time temperature/status information for both temperature sensors.",
    "jira_summary": "SYS-HLR-500 - Remote Real-Time Display",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-414",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SYS-HLR-510",
    "jira": "SCRUM-415",
    "level": "HLR",
    "component": "System",
    "status": "active",
    "parents": [],
    "text": "The computer user shall be able to remotely enable or disable the local third-box temperature display for each temperature sensor, with a response in less than one second.",
    "jira_summary": "SYS-HLR-510 - Remote Third-Box Display Control",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-415",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SYS-HLR-520",
    "jira": "SCRUM-416",
    "level": "HLR",
    "component": "System",
    "status": "active",
    "parents": [],
    "text": "If the computer software is already running while the third box is OFF, required temperature information shall become available within 10 seconds after the third box is turned ON.",
    "jira_summary": "SYS-HLR-520 - Startup and Recovery",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-416",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SYS-HLR-600",
    "jira": "SCRUM-417",
    "level": "HLR",
    "component": "System",
    "status": "active",
    "parents": [],
    "text": "The computer interface shall provide a chart-recorder-style graphical representation of the most recent 300 seconds of temperature data with the specified units, axes, missing-data behavior, and scrolling behavior.",
    "jira_summary": "SYS-HLR-600 - Historical Temperature Graph",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-417",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SYS-HLR-700",
    "jira": "SCRUM-418",
    "level": "HLR",
    "component": "System",
    "status": "active",
    "parents": [],
    "text": "When the computer and third box are ON, the system shall send configurable email notifications when real-time temperature exceeds a configured maximum or falls below a configured minimum. SMS/text-message delivery is out of scope.",
    "jira_summary": "SYS-HLR-700 - Temperature Alerting",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-418",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SYS-HLR-321",
    "jira": "SCRUM-419",
    "level": "HLR",
    "component": "System",
    "status": "active",
    "parents": [
      "SYS-HLR-320"
    ],
    "text": "At laboratory room temperature, the thermometer output shall be approximately 22 deg C +/- 4 deg C.",
    "jira_summary": "SYS-HLR-321 - Room-Temperature Accuracy",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-419",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SYS-HLR-322",
    "jira": "SCRUM-420",
    "level": "HLR",
    "component": "System",
    "status": "active",
    "parents": [
      "SYS-HLR-320"
    ],
    "text": "When a sensor is placed in a water-ice mixture, the thermometer output shall be 0 deg C +/- 2 deg C.",
    "jira_summary": "SYS-HLR-322 - Ice-Water Accuracy",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-420",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "HWE-MLR-200",
    "jira": "SCRUM-421",
    "level": "MLR",
    "component": "Third Box Hardware",
    "status": "active",
    "parents": [
      "SYS-HLR-200"
    ],
    "text": "The hardware shall provide two temperature sensors, each at the end of a 1.0 +/- 0.1 meter cable.",
    "jira_summary": "HWE-MLR-200 - Sensor Quantity and Cable Length",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-421",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "HWE-MLR-201",
    "jira": "SCRUM-422",
    "level": "MLR",
    "component": "Third Box Hardware",
    "status": "active",
    "parents": [
      "SYS-HLR-200"
    ],
    "text": "The sensor assemblies shall tolerate ordinary handling and placement in ice water without damage.",
    "jira_summary": "HWE-MLR-201 - Sensor Mechanical Robustness",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-422",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "HWE-MLR-202",
    "jira": "SCRUM-423",
    "level": "MLR",
    "component": "Third Box Hardware",
    "status": "active",
    "parents": [
      "SYS-HLR-200"
    ],
    "text": "The third box shall be enclosed and shall remain functional after the specified workbench-to-floor drop and upside-down operation.",
    "jira_summary": "HWE-MLR-202 - Third-Box Enclosure and Drop Survival",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-423",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "HWE-MLR-203",
    "jira": "SCRUM-424",
    "level": "MLR",
    "component": "Third Box Hardware",
    "status": "active",
    "parents": [
      "SYS-HLR-200"
    ],
    "text": "External cable connectors shall be securely mounted, casual-user connectable, and shall not break during the specified connected-cable drop.",
    "jira_summary": "HWE-MLR-203 - External Connector Robustness",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-424",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "HWE-MLR-204",
    "jira": "SCRUM-425",
    "level": "MLR",
    "component": "Third Box Hardware",
    "status": "active",
    "parents": [
      "SYS-HLR-210"
    ],
    "text": "The sensor electrical interface shall permit powered connection and disconnection without damaging the sensor or third-box electronics.",
    "jira_summary": "HWE-MLR-204 - Hot-Plug Electrical Protection",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-425",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "HWE-MLR-205",
    "jira": "SCRUM-426",
    "level": "MLR",
    "component": "Third Box Hardware",
    "status": "active",
    "parents": [
      "SYS-HLR-100",
      "SYS-HLR-220"
    ],
    "text": "The third box shall contain a battery and physical ON/OFF power switch and shall operate as a standalone battery-powered thermometer.",
    "jira_summary": "HWE-MLR-205 - Battery and Power Switch",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-426",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "HWE-MLR-206",
    "jira": "SCRUM-427",
    "level": "MLR",
    "component": "Third Box Hardware",
    "status": "active",
    "parents": [
      "SYS-HLR-100"
    ],
    "text": "The third box shall be designed around an ESP32 microcontroller capable of running the required firmware and BLE interface.",
    "jira_summary": "HWE-MLR-206 - ESP32 Processing Platform",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-427",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "HWE-MLR-207",
    "jira": "SCRUM-428",
    "level": "MLR",
    "component": "Third Box Hardware",
    "status": "active",
    "parents": [
      "SYS-HLR-400",
      "SYS-HLR-410"
    ],
    "text": "The third-box local display shall be a character LCD with variable backlight brightness.",
    "jira_summary": "HWE-MLR-207 - Character LCD",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-428",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "HWE-MLR-208",
    "jira": "SCRUM-429",
    "level": "MLR",
    "component": "Third Box Hardware",
    "status": "tbd",
    "parents": [
      "SYS-HLR-400"
    ],
    "text": "The third box shall provide one local physical means of adjusting LCD backlight brightness using either a button-based control or a potentiometer.",
    "jira_summary": "HWE-MLR-208 - Physical Backlight Control",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-429",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "HWE-MLR-209",
    "jira": "SCRUM-430",
    "level": "MLR",
    "component": "Third Box Hardware",
    "status": "active",
    "parents": [
      "SYS-HLR-200"
    ],
    "text": "Each sensor shall connect to the third box through a USB-C termination, and Sensor 1 and Sensor 2 ports shall be visually distinguishable.",
    "jira_summary": "HWE-MLR-209 - USB-C Sensor Connections",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-430",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "HWE-MLR-210",
    "jira": "SCRUM-431",
    "level": "MLR",
    "component": "Third Box Hardware",
    "status": "active",
    "parents": [
      "SYS-HLR-200"
    ],
    "text": "The custom sensor USB-C interface shall be electrically arranged or protected so that foreseeable accidental connection of a standard USB-C cable or power source does not damage the third box or sensor.",
    "jira_summary": "HWE-MLR-210 - USB-C Misconnection Protection",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-431",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "HWE-MLR-211",
    "jira": "SCRUM-432",
    "level": "MLR",
    "component": "Third Box Hardware",
    "status": "active",
    "parents": [
      "SYS-HLR-300",
      "SYS-HLR-400",
      "SYS-HLR-420"
    ],
    "text": "The LCD hardware shall support all characters required to display sensor labels, OFF/DISCONNECTED/error indications, signed temperatures across the required range, and the average value.",
    "jira_summary": "HWE-MLR-211 - Display Character Capability",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-432",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "HWE-MLR-212",
    "jira": "SCRUM-433",
    "level": "MLR",
    "component": "Third Box Hardware",
    "status": "active",
    "parents": [
      "SYS-HLR-300",
      "SYS-HLR-320"
    ],
    "text": "The selected sensors and associated electrical interface shall support the required temperature range and sufficient accuracy to meet the end-to-end accuracy requirements.",
    "jira_summary": "HWE-MLR-212 - Sensor/Signal-Chain Capability",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-433",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "HWE-LLR-200",
    "jira": "SCRUM-434",
    "level": "LLR",
    "component": "Third Box Hardware",
    "status": "active",
    "parents": [
      "HWE-MLR-200"
    ],
    "text": "Each completed sensor cable assembly shall measure between 0.9 m and 1.1 m from the third-box connector interface to the sensing element.",
    "jira_summary": "HWE-LLR-200 - Cable Length Verification",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-434",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "HWE-LLR-201",
    "jira": "SCRUM-435",
    "level": "LLR",
    "component": "Third Box Hardware",
    "status": "active",
    "parents": [
      "HWE-MLR-201"
    ],
    "text": "The sensor head and exposed cable region intended for immersion shall use insulation/encapsulation suitable for temporary immersion in an ice-water mixture.",
    "jira_summary": "HWE-LLR-201 - Wet Sensor Construction",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-435",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "HWE-LLR-202",
    "jira": "SCRUM-436",
    "level": "LLR",
    "component": "Third Box Hardware",
    "status": "active",
    "parents": [
      "HWE-MLR-202"
    ],
    "text": "The ESP32 board/module, LCD, battery, connectors, and other internal assemblies shall be mechanically retained so they do not become loose during the required drop test.",
    "jira_summary": "HWE-LLR-202 - Internal Retention",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-436",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "HWE-LLR-203",
    "jira": "SCRUM-437",
    "level": "LLR",
    "component": "Third Box Hardware",
    "status": "active",
    "parents": [
      "HWE-MLR-202"
    ],
    "text": "Internal wiring and mounted parts shall not depend on gravity or enclosure orientation for electrical continuity.",
    "jira_summary": "HWE-LLR-203 - Orientation-Independent Mounting",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-437",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "HWE-LLR-204",
    "jira": "SCRUM-438",
    "level": "LLR",
    "component": "Third Box Hardware",
    "status": "active",
    "parents": [
      "HWE-MLR-203"
    ],
    "text": "Each external cable connector shall be panel-mounted or mechanically supported independently of PCB solder joints.",
    "jira_summary": "HWE-LLR-204 - Panel Connector Support",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-438",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "HWE-LLR-205",
    "jira": "SCRUM-439",
    "level": "LLR",
    "component": "Third Box Hardware",
    "status": "active",
    "parents": [
      "HWE-MLR-203"
    ],
    "text": "Sensor cable assemblies shall include strain relief at the probe end and connector end.",
    "jira_summary": "HWE-LLR-205 - Cable Strain Relief",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-439",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "HWE-LLR-206",
    "jira": "SCRUM-440",
    "level": "LLR",
    "component": "Third Box Hardware",
    "status": "active",
    "parents": [
      "HWE-MLR-204"
    ],
    "text": "Sensor input circuitry shall tolerate insertion/removal transients without requiring a third-box reset.",
    "jira_summary": "HWE-LLR-206 - Hot-Plug Input Protection",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-440",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "HWE-LLR-207",
    "jira": "SCRUM-441",
    "level": "LLR",
    "component": "Third Box Hardware",
    "status": "active",
    "parents": [
      "HWE-MLR-205"
    ],
    "text": "The battery and regulator path shall supply the simultaneous peak current required by the ESP32, BLE radio, LCD/backlight, and both sensor interfaces.",
    "jira_summary": "HWE-LLR-207 - Battery Supply Capacity",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-441",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "HWE-LLR-208",
    "jira": "SCRUM-442",
    "level": "LLR",
    "component": "Third Box Hardware",
    "status": "active",
    "parents": [
      "HWE-MLR-205"
    ],
    "text": "The power switch shall remove or disable operating power such that the ESP32/LCD cannot continue providing current temperature data when the switch is OFF.",
    "jira_summary": "HWE-LLR-208 - Physical OFF State",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-442",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "HWE-LLR-209",
    "jira": "SCRUM-443",
    "level": "LLR",
    "component": "Third Box Hardware",
    "status": "active",
    "parents": [
      "HWE-MLR-206"
    ],
    "text": "The selected ESP32 device/module shall include BLE capability supported by the selected ESP-IDF version.",
    "jira_summary": "HWE-LLR-209 - ESP32 BLE Capability",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-443",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "HWE-LLR-210",
    "jira": "SCRUM-444",
    "level": "LLR",
    "component": "Third Box Hardware",
    "status": "active",
    "parents": [
      "HWE-MLR-207"
    ],
    "text": "The character LCD shall be electrically interfaced to the ESP32 using the selected supported digital interface and shall provide enough character positions to render the required local states.",
    "jira_summary": "HWE-LLR-210 - LCD Electrical Interface",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-444",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "HWE-LLR-211",
    "jira": "SCRUM-445",
    "level": "LLR",
    "component": "Third Box Hardware",
    "status": "active",
    "parents": [
      "HWE-MLR-207"
    ],
    "text": "The backlight circuit shall support more than two discernible brightness levels without exceeding the LCD backlight current rating.",
    "jira_summary": "HWE-LLR-211 - Variable Backlight Drive",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-445",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "HWE-LLR-212",
    "jira": "SCRUM-446",
    "level": "LLR",
    "component": "Third Box Hardware",
    "status": "tbd",
    "parents": [
      "HWE-MLR-208"
    ],
    "text": "If the button option is selected, the backlight control shall provide a debounced ESP32 digital input used to step through defined brightness levels.",
    "jira_summary": "HWE-LLR-212 - Backlight Control Input - Button Option",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-446",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "HWE-LLR-213",
    "jira": "SCRUM-447",
    "level": "LLR",
    "component": "Third Box Hardware",
    "status": "tbd",
    "parents": [
      "HWE-MLR-208"
    ],
    "text": "If the potentiometer option is selected, the backlight control shall provide an ESP32 ADC-readable voltage spanning the usable control range.",
    "jira_summary": "HWE-LLR-213 - Backlight Control Input - Potentiometer Option",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-447",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "HWE-LLR-214",
    "jira": "SCRUM-448",
    "level": "LLR",
    "component": "Third Box Hardware",
    "status": "active",
    "parents": [
      "HWE-MLR-209"
    ],
    "text": "Sensor 1 shall terminate in a dedicated USB-C receptacle/plug pair assigned to the Sensor 1 electrical interface.",
    "jira_summary": "HWE-LLR-214 - Sensor 1 USB-C Port",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-448",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "HWE-LLR-215",
    "jira": "SCRUM-449",
    "level": "LLR",
    "component": "Third Box Hardware",
    "status": "active",
    "parents": [
      "HWE-MLR-209"
    ],
    "text": "Sensor 2 shall terminate in a dedicated USB-C receptacle/plug pair assigned to the Sensor 2 electrical interface.",
    "jira_summary": "HWE-LLR-215 - Sensor 2 USB-C Port",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-449",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "HWE-LLR-216",
    "jira": "SCRUM-450",
    "level": "LLR",
    "component": "Third Box Hardware",
    "status": "active",
    "parents": [
      "HWE-MLR-209"
    ],
    "text": "The enclosure shall use permanent labels, symbols, or other visual differentiation to identify Sensor 1 and Sensor 2 ports.",
    "jira_summary": "HWE-LLR-216 - Port Identification",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-450",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "HWE-LLR-217",
    "jira": "SCRUM-451",
    "level": "LLR",
    "component": "Third Box Hardware",
    "status": "active",
    "parents": [
      "HWE-MLR-210"
    ],
    "text": "The custom sensor connector design shall prevent an accidental standard USB-C VBUS connection from applying damaging voltage to sensor-signal pins or the ESP32.",
    "jira_summary": "HWE-LLR-217 - USB-C VBUS Protection",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-451",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "HWE-LLR-218",
    "jira": "SCRUM-452",
    "level": "LLR",
    "component": "Third Box Hardware",
    "status": "active",
    "parents": [
      "HWE-MLR-210"
    ],
    "text": "Custom sensor signals shall not be exposed on standard USB-C pins in a way that can damage a standard USB host/device during foreseeable accidental connection.",
    "jira_summary": "HWE-LLR-218 - USB-C Signal Isolation",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-452",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "HWE-LLR-219",
    "jira": "SCRUM-453",
    "level": "LLR",
    "component": "Third Box Hardware",
    "status": "active",
    "parents": [
      "HWE-MLR-211"
    ],
    "text": "The physical display size shall permit rendering at least a sensor identifier/state and a signed temperature value within -10 to +63 deg C.",
    "jira_summary": "HWE-LLR-219 - LCD Signed Temperature Support",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-453",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "HWE-LLR-220",
    "jira": "SCRUM-454",
    "level": "LLR",
    "component": "Third Box Hardware",
    "status": "active",
    "parents": [
      "HWE-MLR-212"
    ],
    "text": "The selected sensor datasheet shall specify an operating/measurement range that includes -10 through +63 deg C.",
    "jira_summary": "HWE-LLR-220 - Sensor Range Selection",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-454",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "HWE-LLR-221",
    "jira": "SCRUM-455",
    "level": "LLR",
    "component": "Third Box Hardware",
    "status": "active",
    "parents": [
      "HWE-MLR-212"
    ],
    "text": "The hardware error budget at 0 deg C and approximately 22 deg C shall leave sufficient margin for software conversion/rounding while meeting the stakeholder tolerances.",
    "jira_summary": "HWE-LLR-221 - Accuracy Budget",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-455",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-EMB-MLR-300",
    "jira": "SCRUM-456",
    "level": "MLR",
    "component": "ESP32 Firmware",
    "status": "active",
    "parents": [
      "SYS-HLR-100"
    ],
    "text": "Third-box firmware shall be implemented for the ESP32 using ESP-IDF and the C programming language.",
    "jira_summary": "SWE-EMB-MLR-300 - ESP-IDF C Firmware",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-456",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-EMB-MLR-301",
    "jira": "SCRUM-457",
    "level": "MLR",
    "component": "ESP32 Firmware",
    "status": "active",
    "parents": [
      "SYS-HLR-300",
      "SYS-HLR-310"
    ],
    "text": "The third-box firmware shall continuously acquire readings/status from both temperature sensors while powered ON.",
    "jira_summary": "SWE-EMB-MLR-301 - Continuous Sensor Acquisition",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-457",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-EMB-MLR-302",
    "jira": "SCRUM-458",
    "level": "MLR",
    "component": "ESP32 Firmware",
    "status": "active",
    "parents": [
      "SYS-HLR-600"
    ],
    "text": "The third box shall maintain separate rolling buffers containing the last 300 one-second records for Sensor 1 and Sensor 2.",
    "jira_summary": "SWE-EMB-MLR-302 - Two 300-Reading History Buffers",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-458",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-EMB-MLR-303",
    "jira": "SCRUM-459",
    "level": "MLR",
    "component": "ESP32 Firmware",
    "status": "active",
    "parents": [
      "SYS-HLR-400",
      "SYS-HLR-420"
    ],
    "text": "The third box shall expose three user-visible states per sensor: ON, OFF, and DISCONNECTED.",
    "jira_summary": "SWE-EMB-MLR-303 - Sensor State Model",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-459",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-EMB-MLR-304",
    "jira": "SCRUM-460",
    "level": "MLR",
    "component": "ESP32 Firmware",
    "status": "active",
    "parents": [
      "SYS-HLR-210",
      "SYS-HLR-420"
    ],
    "text": "A disconnected/faulted sensor shall be reported as DISCONNECTED while the fault exists and shall return to the OFF display state after a valid reconnection unless the user subsequently enables it.",
    "jira_summary": "SWE-EMB-MLR-304 - Disconnect Transition Behavior",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-460",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-EMB-MLR-305",
    "jira": "SCRUM-461",
    "level": "MLR",
    "component": "ESP32 Firmware",
    "status": "active",
    "parents": [
      "SYS-HLR-400"
    ],
    "text": "The firmware shall independently control whether Sensor 1 and Sensor 2 temperatures are shown on the LCD.",
    "jira_summary": "SWE-EMB-MLR-305 - Independent Local Display Control",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-461",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-EMB-MLR-306",
    "jira": "SCRUM-462",
    "level": "MLR",
    "component": "ESP32 Firmware",
    "status": "active",
    "parents": [
      "SYS-HLR-400"
    ],
    "text": "When both sensor display states are ON and both readings are valid, the LCD shall display Sensor 1, Sensor 2, and the average of the two readings.",
    "jira_summary": "SWE-EMB-MLR-306 - Local Average Display",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-462",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-EMB-MLR-307",
    "jira": "SCRUM-463",
    "level": "MLR",
    "component": "ESP32 Firmware",
    "status": "active",
    "parents": [
      "SYS-HLR-410"
    ],
    "text": "The firmware shall update the LCD to reflect a local sensor-display control action within approximately 20 ms.",
    "jira_summary": "SWE-EMB-MLR-307 - Local Display Response Time",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-463",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-EMB-MLR-308",
    "jira": "SCRUM-464",
    "level": "MLR",
    "component": "ESP32 Firmware",
    "status": "active",
    "parents": [
      "SYS-HLR-420"
    ],
    "text": "The firmware shall render a clear local fault/disconnected indication instead of a valid temperature for an unavailable sensor.",
    "jira_summary": "SWE-EMB-MLR-308 - Local Fault Display",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-464",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-EMB-MLR-309",
    "jira": "SCRUM-465",
    "level": "MLR",
    "component": "ESP32 Firmware",
    "status": "active",
    "parents": [
      "SYS-HLR-400"
    ],
    "text": "The firmware shall support variable LCD backlight brightness using the selected physical backlight input.",
    "jira_summary": "SWE-EMB-MLR-309 - Backlight Brightness Control",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-465",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-EMB-MLR-310",
    "jira": "SCRUM-466",
    "level": "MLR",
    "component": "ESP32 Firmware",
    "status": "active",
    "parents": [
      "SYS-HLR-300",
      "SYS-HLR-400"
    ],
    "text": "The third-box LCD shall present temperature values in degrees Celsius and support signed values across the required system range.",
    "jira_summary": "SWE-EMB-MLR-310 - Local Celsius Presentation",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-466",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-EMB-MLR-311",
    "jira": "SCRUM-467",
    "level": "MLR",
    "component": "ESP32 Firmware",
    "status": "active",
    "parents": [
      "SYS-HLR-500"
    ],
    "text": "The firmware shall provide an internally consistent current snapshot containing both sensor values, sensor states, display-enable states, average validity/value, and sample identity for a computer request.",
    "jira_summary": "SWE-EMB-MLR-311 - Atomic Current Snapshot",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-467",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-EMB-MLR-312",
    "jira": "SCRUM-468",
    "level": "MLR",
    "component": "ESP32 Firmware",
    "status": "active",
    "parents": [
      "SYS-HLR-210"
    ],
    "text": "Sensor acquisition shall automatically resume after reconnection without restarting the ESP32 firmware.",
    "jira_summary": "SWE-EMB-MLR-312 - Automatic Sensor Recovery",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-468",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-EMB-MLR-313",
    "jira": "SCRUM-469",
    "level": "MLR",
    "component": "ESP32 Firmware",
    "status": "active",
    "parents": [
      "SYS-HLR-510"
    ],
    "text": "The firmware shall accept validated remote commands that change the same sensor display-enable state controlled by the physical sensor buttons.",
    "jira_summary": "SWE-EMB-MLR-313 - Remote Display Command Handling",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-469",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-EMB-LLR-300",
    "jira": "SCRUM-470",
    "level": "LLR",
    "component": "ESP32 Firmware",
    "status": "active",
    "parents": [
      "SWE-EMB-MLR-300"
    ],
    "text": "The ESP-IDF application shall initialize sensor drivers, LCD/backlight drivers, input handlers, shared state, history buffers, and the BLE service from app_main().",
    "jira_summary": "SWE-EMB-LLR-300 - Firmware Entry Point",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-470",
    "jira_snapshot_status": "Approved",
