    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-EMB-LLR-301",
    "jira": "SCRUM-471",
    "level": "LLR",
    "component": "ESP32 Firmware",
    "status": "active",
    "parents": [
      "SWE-EMB-MLR-301"
    ],
    "text": "Firmware shall maintain one runtime record per sensor containing latest temperature in Celsius, validity/connection state, display-enabled state, and the latest sample sequence number.",
    "jira_summary": "SWE-EMB-LLR-301 - Per-Sensor Runtime Record",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-471",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-EMB-LLR-302",
    "jira": "SCRUM-472",
    "level": "LLR",
    "component": "ESP32 Firmware",
    "status": "active",
    "parents": [
      "SWE-EMB-MLR-301"
    ],
    "text": "The sensor acquisition task shall begin a new read for each sensor whenever the previous read cycle is complete and shall update the shared runtime record only after validating the result.",
    "jira_summary": "SWE-EMB-LLR-302 - Continuous Acquisition Loop",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-472",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-EMB-LLR-303",
    "jira": "SCRUM-473",
    "level": "LLR",
    "component": "ESP32 Firmware",
    "status": "active",
    "parents": [
      "SWE-EMB-MLR-301"
    ],
    "text": "A read failure on one sensor shall not skip or block acquisition of the other sensor.",
    "jira_summary": "SWE-EMB-LLR-303 - Independent Sensor Reads",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-473",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-EMB-LLR-304",
    "jira": "SCRUM-474",
    "level": "LLR",
    "component": "ESP32 Firmware",
    "status": "active",
    "parents": [
      "SWE-EMB-MLR-302"
    ],
    "text": "A periodic timer/task shall snapshot each sensor runtime record into its history buffer once every 1000 ms.",
    "jira_summary": "SWE-EMB-LLR-304 - One-Second History Timer",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-474",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-EMB-LLR-305",
    "jira": "SCRUM-475",
    "level": "LLR",
    "component": "ESP32 Firmware",
    "status": "active",
    "parents": [
      "SWE-EMB-MLR-302"
    ],
    "text": "Each sensor history buffer shall be implemented as a fixed-capacity circular buffer of 300 records; adding record 301 shall overwrite the oldest record.",
    "jira_summary": "SWE-EMB-LLR-305 - Fixed-Size Circular Buffers",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-475",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-EMB-LLR-306",
    "jira": "SCRUM-476",
    "level": "LLR",
    "component": "ESP32 Firmware",
    "status": "active",
    "parents": [
      "SWE-EMB-MLR-302"
    ],
    "text": "Each stored history record shall contain at least the sample sequence number, temperature value when valid, and a sensor status value sufficient to distinguish valid and missing/disconnected data.",
    "jira_summary": "SWE-EMB-LLR-306 - History Record Contents",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-476",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-EMB-LLR-307",
    "jira": "SCRUM-477",
    "level": "LLR",
    "component": "ESP32 Firmware",
    "status": "active",
    "parents": [
      "SWE-EMB-MLR-302"
    ],
    "text": "History retrieval code shall expose records in chronological order from oldest available to newest available regardless of circular-buffer wrap position.",
    "jira_summary": "SWE-EMB-LLR-307 - History Ordering",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-477",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-EMB-LLR-308",
    "jira": "SCRUM-478",
    "level": "LLR",
    "component": "ESP32 Firmware",
    "status": "active",
    "parents": [
      "SWE-EMB-MLR-303"
    ],
    "text": "Firmware shall maintain sensor connection/health separately from the user display-enable flag and shall derive the externally visible ON/OFF/DISCONNECTED state from those values.",
    "jira_summary": "SWE-EMB-LLR-308 - Internal State Separation",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-478",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-EMB-LLR-309",
    "jira": "SCRUM-479",
    "level": "LLR",
    "component": "ESP32 Firmware",
    "status": "active",
    "parents": [
      "SWE-EMB-MLR-303"
    ],
    "text": "A valid connected sensor with display_enabled=true shall report ON; a valid connected sensor with display_enabled=false shall report OFF; an invalid/disconnected sensor shall report DISCONNECTED.",
    "jira_summary": "SWE-EMB-LLR-309 - Visible State Mapping",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-479",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-EMB-LLR-310",
    "jira": "SCRUM-480",
    "level": "LLR",
    "component": "ESP32 Firmware",
    "status": "active",
    "parents": [
      "SWE-EMB-MLR-304"
    ],
    "text": "After the configured sensor-driver fault criterion is met, firmware shall set the sensor connection/health state to DISCONNECTED and invalidate its current temperature.",
    "jira_summary": "SWE-EMB-LLR-310 - Fault Entry",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-480",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-EMB-LLR-311",
    "jira": "SCRUM-481",
    "level": "LLR",
    "component": "ESP32 Firmware",
    "status": "active",
    "parents": [
      "SWE-EMB-MLR-304"
    ],
    "text": "When a DISCONNECTED sensor produces valid readings again and meets the configured recovery criterion, firmware shall mark it connected and restore the sensor's display-enabled state from immediately before the disconnection. A sensor that was ON shall return ON; a sensor that was OFF shall remain OFF. This state retention shall be implemented locally in the third-box firmware and shall not depend on a computer connection. Verification: exercise ON-disconnect-reconnect and OFF-disconnect-reconnect cases for each sensor while the computer is absent or disconnected, and confirm the restored local state matches the pre-disconnection state.",
    "jira_summary": "SWE-EMB-LLR-311 - Reconnection State",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-481",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-EMB-LLR-312",
    "jira": "SCRUM-482",
    "level": "LLR",
    "component": "ESP32 Firmware",
    "status": "active",
    "parents": [
      "SWE-EMB-MLR-305"
    ],
    "text": "A debounced press of Sensor 1 or Sensor 2 button shall toggle that sensor display_enabled flag only when the sensor is connected.",
    "jira_summary": "SWE-EMB-LLR-312 - Physical Button Toggle",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-482",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-EMB-LLR-313",
    "jira": "SCRUM-483",
    "level": "LLR",
    "component": "ESP32 Firmware",
    "status": "active",
    "parents": [
      "SWE-EMB-MLR-305"
    ],
    "text": "Pressing a sensor display button while that sensor is DISCONNECTED shall not cause a valid temperature to be displayed or change the reported DISCONNECTED state.",
    "jira_summary": "SWE-EMB-LLR-313 - Disconnected Button Behavior",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-483",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-EMB-LLR-314",
    "jira": "SCRUM-484",
    "level": "LLR",
    "component": "ESP32 Firmware",
    "status": "active",
    "parents": [
      "SWE-EMB-MLR-306"
    ],
    "text": "The firmware shall calculate the displayed average as (sensor1_c + sensor2_c) / 2 using sufficient intermediate precision to avoid overflow or unnecessary rounding error.",
    "jira_summary": "SWE-EMB-LLR-314 - Average Calculation",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-484",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-EMB-LLR-315",
    "jira": "SCRUM-485",
    "level": "LLR",
    "component": "ESP32 Firmware",
    "status": "active",
    "parents": [
      "SWE-EMB-MLR-306"
    ],
    "text": "The local average shall be valid/displayed only when both sensors are connected, valid, and their display_enabled flags are true.",
    "jira_summary": "SWE-EMB-LLR-315 - Average Validity",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-485",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-EMB-LLR-316",
    "jira": "SCRUM-486",
    "level": "LLR",
    "component": "ESP32 Firmware",
    "status": "active",
    "parents": [
      "SWE-EMB-MLR-307"
    ],
    "text": "Local button handling shall render from the latest cached sensor values rather than waiting for a new sensor conversion.",
    "jira_summary": "SWE-EMB-LLR-316 - Cached Display Data",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-486",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-EMB-LLR-317",
    "jira": "SCRUM-487",
    "level": "LLR",
    "component": "ESP32 Firmware",
    "status": "active",
    "parents": [
      "SWE-EMB-MLR-307"
    ],
    "text": "The local input handler shall signal the LCD update path immediately after a valid button-state change so that software scheduling does not intentionally delay the update beyond 20 ms.",
    "jira_summary": "SWE-EMB-LLR-317 - Button-to-Render Scheduling",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-487",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-EMB-LLR-318",
    "jira": "SCRUM-488",
    "level": "LLR",
    "component": "ESP32 Firmware",
    "status": "active",
    "parents": [
      "SWE-EMB-MLR-308"
    ],
    "text": "For a disconnected/faulted sensor, the LCD rendering layer shall display a DISCONNECTED or equivalent clear error label instead of a numeric temperature.",
    "jira_summary": "SWE-EMB-LLR-318 - Disconnected LCD Text",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-488",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-EMB-LLR-319",
    "jira": "SCRUM-489",
    "level": "LLR",
    "component": "ESP32 Firmware",
    "status": "active",
    "parents": [
      "SWE-EMB-MLR-305"
    ],
    "text": "For a connected sensor with display_enabled=false, the LCD rendering layer shall display Sensor 1 OFF or Sensor 2 OFF, as applicable.",
    "jira_summary": "SWE-EMB-LLR-319 - Off LCD Text",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-489",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-EMB-LLR-320",
    "jira": "SCRUM-490",
    "level": "LLR",
    "component": "ESP32 Firmware",
    "status": "active",
    "parents": [
      "SWE-EMB-MLR-309"
    ],
    "text": "Firmware shall expose a backlight-set function accepting a normalized brightness level and isolate physical-input-specific logic from LCD rendering logic.",
    "jira_summary": "SWE-EMB-LLR-320 - Backlight Abstraction",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-490",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-EMB-LLR-321",
    "jira": "SCRUM-491",
    "level": "LLR",
    "component": "ESP32 Firmware",
    "status": "tbd",
    "parents": [
      "SWE-EMB-MLR-309"
    ],
    "text": "If the button option is selected, each debounced backlight-button press shall cycle through a finite set of defined brightness levels including at least low, medium, and high.",
    "jira_summary": "SWE-EMB-LLR-321 - Button Backlight Algorithm",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-491",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-EMB-LLR-322",
    "jira": "SCRUM-492",
    "level": "LLR",
    "component": "ESP32 Firmware",
    "status": "tbd",
    "parents": [
      "SWE-EMB-MLR-309"
    ],
    "text": "If the potentiometer option is selected, firmware shall periodically sample the ADC input, map the usable ADC range to backlight brightness, and suppress insignificant jitter before updating the backlight.",
    "jira_summary": "SWE-EMB-LLR-322 - Potentiometer Backlight Algorithm",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-492",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-EMB-LLR-323",
    "jira": "SCRUM-493",
    "level": "LLR",
    "component": "ESP32 Firmware",
    "status": "active",
    "parents": [
      "SWE-EMB-MLR-310"
    ],
    "text": "All third-box internal temperature calculations and BLE payload temperatures shall use Celsius as the canonical unit.",
    "jira_summary": "SWE-EMB-LLR-323 - Canonical Temperature Unit",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-493",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-EMB-LLR-324",
    "jira": "SCRUM-494",
    "level": "LLR",
    "component": "ESP32 Firmware",
    "status": "active",
    "parents": [
      "SWE-EMB-MLR-311"
    ],
    "text": "The current-data response shall copy both sensor runtime records under a synchronization mechanism so one response cannot mix values from different update instants.",
    "jira_summary": "SWE-EMB-LLR-324 - Snapshot Locking",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-494",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-EMB-LLR-325",
    "jira": "SCRUM-495",
    "level": "LLR",
    "component": "ESP32 Firmware",
    "status": "active",
    "parents": [
      "SWE-EMB-MLR-311"
    ],
    "text": "Firmware shall generate or increment a boot/session identifier at startup and include it with current/history metadata so computer software can distinguish samples across third-box restarts.",
    "jira_summary": "SWE-EMB-LLR-325 - Boot Identifier",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-495",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-EMB-LLR-326",
    "jira": "SCRUM-496",
    "level": "LLR",
    "component": "ESP32 Firmware",
    "status": "active",
    "parents": [
      "SWE-EMB-MLR-312"
    ],
    "text": "A successful sensor read after a disconnected period shall restore acquisition status without restarting the acquisition task, BLE service, or whole device.",
    "jira_summary": "SWE-EMB-LLR-326 - Recovery Without Restart",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-496",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-EMB-LLR-327",
    "jira": "SCRUM-497",
    "level": "LLR",
    "component": "ESP32 Firmware",
    "status": "active",
    "parents": [
      "SWE-EMB-MLR-313"
    ],
    "text": "Remote display commands and physical buttons shall update the same display_enabled fields and invoke the same LCD rendering path.",
    "jira_summary": "SWE-EMB-LLR-327 - Remote/Local Shared State",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-497",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-EMB-LLR-328",
    "jira": "SCRUM-498",
    "level": "LLR",
    "component": "ESP32 Firmware",
    "status": "active",
    "parents": [
      "SWE-EMB-MLR-313"
    ],
    "text": "Firmware shall reject remote display-control requests containing an invalid sensor identifier or unsupported state value without changing local state.",
    "jira_summary": "SWE-EMB-LLR-328 - Remote Command Validation",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-498",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "INT-MLR-400",
    "jira": "SCRUM-499",
    "level": "MLR",
    "component": "BLE Interface",
    "status": "active",
    "parents": [
      "SYS-HLR-110",
      "SYS-HLR-500"
    ],
    "text": "The third box and computer connection component shall communicate using Bluetooth Low Energy.",
    "jira_summary": "INT-MLR-400 - BLE Transport",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-499",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "INT-MLR-401",
    "jira": "SCRUM-500",
    "level": "MLR",
    "component": "BLE Interface",
    "status": "active",
    "parents": [
      "SYS-HLR-500"
    ],
    "text": "The third box shall transmit application data only in response to a computer-initiated BLE request; unsolicited application telemetry shall not be required.",
    "jira_summary": "INT-MLR-401 - Request/Response Application Protocol",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-500",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "INT-MLR-402",
    "jira": "SCRUM-501",
    "level": "MLR",
    "component": "BLE Interface",
    "status": "active",
    "parents": [
      "SYS-HLR-500"
    ],
    "text": "The BLE interface shall support a request that returns the current state and value of both sensors and the current local display state.",
    "jira_summary": "INT-MLR-402 - Current Data Transaction",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-501",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "INT-MLR-403",
    "jira": "SCRUM-502",
    "level": "MLR",
    "component": "BLE Interface",
    "status": "active",
    "parents": [
      "SYS-HLR-510"
    ],
    "text": "The BLE interface shall support validated remote commands to change Sensor 1 and Sensor 2 local display-enable states and shall expose the resulting state.",
    "jira_summary": "INT-MLR-403 - Remote Display Control Transaction",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-502",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "INT-MLR-404",
    "jira": "SCRUM-503",
    "level": "MLR",
    "component": "BLE Interface",
    "status": "active",
    "parents": [
      "SYS-HLR-600"
    ],
    "text": "The BLE interface shall permit retrieval of both 300-record sensor history buffers from the third box.",
    "jira_summary": "INT-MLR-404 - Historical Data Transaction",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-503",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "INT-MLR-405",
    "jira": "SCRUM-504",
    "level": "MLR",
    "component": "BLE Interface",
    "status": "active",
    "parents": [
      "SYS-HLR-520"
    ],
    "text": "The BLE protocol and computer client shall support automatic reconnection/recovery without requiring application restart.",
    "jira_summary": "INT-MLR-405 - Connection Recovery",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-504",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "INT-MLR-406",
    "jira": "SCRUM-505",
    "level": "MLR",
    "component": "BLE Interface",
    "status": "active",
    "parents": [
      "SYS-HLR-510"
    ],
    "text": "The BLE interface shall use an authentication/bonding mechanism sufficient to prevent an arbitrary nearby BLE client from issuing third-box control commands.",
    "jira_summary": "INT-MLR-406 - BLE Access Control",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-505",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "INT-MLR-407",
    "jira": "SCRUM-506",
    "level": "MLR",
    "component": "BLE Interface",
    "status": "active",
    "parents": [
      "SYS-HLR-500",
      "SYS-HLR-510",
      "SYS-HLR-600"
    ],
    "text": "The BLE application protocol shall provide protocol-version identification and explicit success/error status for commands.",
    "jira_summary": "INT-MLR-407 - Protocol Versioning and Error Reporting",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-506",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "INT-LLR-400",
    "jira": "SCRUM-507",
    "level": "LLR",
    "component": "BLE Interface",
    "status": "active",
    "parents": [
      "INT-MLR-400"
    ],
    "text": "The ESP32 shall expose one custom 128-bit GATT service dedicated to thermometer application communication; the computer connection process shall identify compatible devices by this service UUID.",
    "jira_summary": "INT-LLR-400 - Custom GATT Service",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-507",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "INT-LLR-401",
    "jira": "SCRUM-508",
    "level": "LLR",
    "component": "BLE Interface",
    "status": "active",
    "parents": [
      "INT-MLR-401"
    ],
    "text": "Application temperature and history data shall be transmitted only in response to computer-initiated GATT transactions. The third box shall not transmit application temperature or history data using unsolicited GATT notifications or indications.",
    "jira_summary": "INT-LLR-401 - No Application Notifications",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-508",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "INT-LLR-402",
    "jira": "SCRUM-509",
    "level": "LLR",
    "component": "BLE Interface",
    "status": "active",
    "parents": [
      "INT-MLR-401"
    ],
    "text": "Each application request shall carry a request identifier, and each response shall echo that identifier so the client can match responses to requests.",
    "jira_summary": "INT-LLR-402 - Request Identifier",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-509",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "INT-LLR-403",
    "jira": "SCRUM-510",
    "level": "LLR",
    "component": "BLE Interface",
    "status": "active",
    "parents": [
      "INT-MLR-407"
    ],
    "text": "Each application message shall contain at least protocol version, opcode, request identifier, payload length, and response status when applicable. Optionally, the application messages may include parity bits",
    "jira_summary": "INT-LLR-403 - Protocol Header",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-510",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "INT-LLR-404",
    "jira": "SCRUM-511",
    "level": "LLR",
    "component": "BLE Interface",
    "status": "active",
    "parents": [
      "INT-MLR-402"
    ],
    "text": "The protocol shall define a GET_CURRENT request whose response includes boot identifier, newest sample sequence, Sensor 1 temperature/status/display state and Sensor 2 temperature/status/display state.",
    "jira_summary": "INT-LLR-404 - GET_CURRENT Opcode",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-511",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "INT-LLR-405",
    "jira": "SCRUM-512",
    "level": "LLR",
    "component": "BLE Interface",
    "status": "active",
    "parents": [
      "INT-MLR-403"
    ],
    "text": "The protocol shall define a SET_DISPLAY request containing sensor identifier and desired display-enabled Boolean value.",
    "jira_summary": "INT-LLR-405 - SET_DISPLAY Opcode",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-512",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "INT-LLR-406",
    "jira": "SCRUM-513",
    "level": "LLR",
    "component": "BLE Interface",
    "status": "active",
    "parents": [
      "INT-MLR-403"
    ],
    "text": "The SET_DISPLAY response shall return success/error and the resulting externally visible sensor state.",
    "jira_summary": "INT-LLR-406 - SET_DISPLAY Response",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-513",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "INT-LLR-407",
    "jira": "SCRUM-514",
    "level": "LLR",
    "component": "BLE Interface",
    "status": "active",
    "parents": [
      "INT-MLR-404"
    ],
    "text": "The protocol shall define a GET_HISTORY_META request returning boot identifier, newest sequence, and available record count for each sensor buffer.",
    "jira_summary": "INT-LLR-407 - GET_HISTORY_META Opcode",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-514",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "INT-LLR-408",
    "jira": "SCRUM-515",
    "level": "LLR",
    "component": "BLE Interface",
    "status": "active",
    "parents": [
      "INT-MLR-404"
    ],
    "text": "The protocol shall define a GET_HISTORY_CHUNK request containing sensor identifier, chronological starting offset/sequence, and requested record count.",
    "jira_summary": "INT-LLR-408 - GET_HISTORY_CHUNK Opcode",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-515",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "INT-LLR-409",
    "jira": "SCRUM-516",
    "level": "LLR",
    "component": "BLE Interface",
    "status": "active",
    "parents": [
      "INT-MLR-404"
    ],
    "text": "A history-chunk response shall contain only complete history records and shall identify the sensor, starting record position/sequence, and number of records returned.",
    "jira_summary": "INT-LLR-409 - History Chunk Response",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-516",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "INT-LLR-410",
    "jira": "SCRUM-517",
    "level": "LLR",
    "component": "BLE Interface",
    "status": "active",
    "parents": [
      "INT-MLR-404"
    ],
    "text": "The history retrieval implementation shall segment the 300-record history into BLE-safe chunks and shall not assume the entire history fits in one ATT payload.",
    "jira_summary": "INT-LLR-410 - History Chunk Size",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-517",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "INT-LLR-411",
    "jira": "SCRUM-518",
    "level": "LLR",
    "component": "BLE Interface",
    "status": "active",
    "parents": [
      "INT-MLR-404"
    ],
    "text": "The computer BLE client shall request a larger ATT MTU when supported. If a smaller MTU is negotiated, the history transfer shall remain functional by reducing the number of complete history records included in each chunk so that each response fits within the negotiated MTU.",
    "jira_summary": "INT-LLR-411 - MTU Negotiation",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-518",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "INT-LLR-412",
    "jira": "SCRUM-519",
    "level": "LLR",
    "component": "BLE Interface",
    "status": "active",
    "parents": [
      "INT-MLR-407"
    ],
    "text": "The protocol shall define at least SUCCESS, INVALID_COMMAND, INVALID_SENSOR, INVALID_VALUE, NOT_AVAILABLE, and INTERNAL_ERROR response statuses.",
    "jira_summary": "INT-LLR-412 - Status Codes",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-519",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "INT-LLR-413",
    "jira": "SCRUM-520",
    "level": "LLR",
    "component": "BLE Interface",
    "status": "active",
    "parents": [
      "INT-MLR-407"
    ],
    "text": "A receiver shall reject an application message using an unsupported protocol version without applying state-changing commands.",
    "jira_summary": "INT-LLR-413 - Unsupported Version Handling",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-520",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "INT-LLR-414",
    "jira": "SCRUM-521",
    "level": "LLR",
    "component": "BLE Interface",
    "status": "active",
    "parents": [
      "INT-MLR-406"
    ],
    "text": "The ESP32 and computer client shall use BLE pairing/bonding with authenticated/encrypted access for state-changing characteristics/commands.",
    "jira_summary": "INT-LLR-414 - BLE Pairing/Bonding",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-521",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "INT-LLR-415",
    "jira": "SCRUM-522",
    "level": "LLR",
    "component": "BLE Interface",
    "status": "active",
    "parents": [
      "INT-MLR-405"
    ],
    "text": "After BLE link loss, the computer client shall resume scanning/connection attempts automatically and shall not require a user to restart the web application.",
    "jira_summary": "INT-LLR-415 - Reconnect Discovery",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-522",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-CONN-MLR-500",
    "jira": "SCRUM-523",
    "level": "MLR",
    "component": "Computer BLE Connection Process",
    "status": "active",
    "parents": [
      "SYS-HLR-110",
      "SYS-HLR-500"
    ],
    "text": "The computer application shall consist of a MySQL database, a web application/server, and a third-box connection component.",
    "jira_summary": "SWE-CONN-MLR-500 - Three-Component Computer Architecture",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-523",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-CONN-MLR-501",
    "jira": "SCRUM-524",
    "level": "MLR",
    "component": "Computer BLE Connection Process",
    "status": "active",
    "parents": [
      "SYS-HLR-500"
    ],
    "text": "The third-box BLE connection component shall run in separately (I.E: via different operating-system process or thread) from the web UI/server.",
    "jira_summary": "SWE-CONN-MLR-501 - Separate BLE Connection Process",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-524",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-CONN-MLR-502",
    "jira": "SCRUM-525",
    "level": "MLR",
    "component": "Computer BLE Connection Process",
    "status": "active",
    "parents": [
      "SYS-HLR-500"
    ],
    "text": "The third-box connection process shall request current data from the third box at a nominal 1 Hz rate and publish each result to MySQL.",
    "jira_summary": "SWE-CONN-MLR-502 - One-Hertz Third-Box Polling",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-525",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-CONN-MLR-503",
    "jira": "SCRUM-526",
    "level": "MLR",
    "component": "Computer BLE Connection Process",
    "status": "active",
    "parents": [
      "SYS-HLR-600",
      "SYS-HLR-520"
    ],
    "text": "On application startup or BLE reconnection, the connection process shall retrieve available third-box history and persist it so the most recent 300 seconds can be displayed within the stakeholder time limit.",
    "jira_summary": "SWE-CONN-MLR-503 - Startup History Synchronization",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-526",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-CONN-MLR-504",
    "jira": "SCRUM-527",
    "level": "MLR",
    "component": "Computer BLE Connection Process",
    "status": "active",
    "parents": [
      "SYS-HLR-500",
      "SYS-HLR-600"
    ],
    "text": "While third-box data is unavailable, the computer software shall preserve the one-second time base and represent missing data distinctly from valid sensor measurements.",
    "jira_summary": "SWE-CONN-MLR-504 - Unavailable-Data Recording",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-527",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-CONN-MLR-505",
    "jira": "SCRUM-528",
    "level": "MLR",
    "component": "Computer BLE Connection Process",
    "status": "active",
    "parents": [
      "SYS-HLR-510"
    ],
    "text": "The web application and BLE process shall exchange remote third-box control requests through a defined inter-process mechanism that supports the less-than-one-second response requirement.",
    "jira_summary": "SWE-CONN-MLR-505 - Control Command Relay",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-528",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-CONN-MLR-506",
    "jira": "SCRUM-529",
    "level": "MLR",
    "component": "Computer BLE Connection Process",
    "status": "active",
    "parents": [
      "SYS-HLR-520"
    ],
    "text": "The connection process shall automatically detect, reconnect to, and resume polling a compatible third box after it becomes available.",
    "jira_summary": "SWE-CONN-MLR-506 - Automatic BLE Reconnect",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-529",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-DB-MLR-550",
    "jira": "SCRUM-530",
    "level": "MLR",
    "component": "MySQL Database",
    "status": "active",
    "parents": [
      "SYS-HLR-110",
      "SYS-HLR-600"
    ],
    "text": "MySQL shall provide persistent storage for temperature history and shared state used by the computer application.",
    "jira_summary": "SWE-DB-MLR-550 - MySQL Persistent Storage",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-530",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-DB-MLR-551",
    "jira": "SCRUM-531",
    "level": "MLR",
    "component": "MySQL Database",
    "status": "active",
    "parents": [
      "SYS-HLR-500",
      "SYS-HLR-600"
    ],
    "text": "The database shall persist one-second temperature records for three series: probe 1, probe 2, and the computed average of the two, with per-series value and status, third-box device and session identity, and sample identity. Series status shall distinguish valid readings from unplugged-sensor, no-data, provisional, and derived-unavailable conditions.",
    "jira_summary": "SWE-DB-MLR-551 - Temperature Sample Schema",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-531",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-DB-MLR-552",
    "jira": "SCRUM-532",
    "level": "MLR",
    "component": "MySQL Database",
    "status": "active",
    "parents": [
      "SYS-HLR-510",
      "SYS-HLR-700"
    ],
    "text": "The database shall persist temperature-sample history and email alert recipients/rules required by the web application. Application user roles and third-box control-command state are not persisted because this is a trusted local application with no user accounts and control commands are sent directly to the Python BLE backend.",
    "jira_summary": "SWE-DB-MLR-552 - Configuration and Authorization Storage",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-532",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-DB-MLR-553",
    "jira": "SCRUM-533",
    "level": "MLR",
    "component": "MySQL Database",
    "status": "active",
    "parents": [
      "SYS-HLR-510"
    ],
    "text": "MySQL shall be the authoritative source for historical temperature samples displayed by the web application. Third-box control commands shall be sent directly from the web application to the Python BLE backend and shall not pass through a MySQL command queue. Verification: issue a display-toggle command via the web UI and confirm the third-box display changes in under 1 second.",
    "jira_summary": "SWE-DB-MLR-553 - Control Command Queue",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-533",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-DB-MLR-554",
    "jira": "SCRUM-534",
    "level": "MLR",
    "component": "MySQL Database",
    "status": "active",
    "parents": [
      "SYS-HLR-500",
      "SYS-HLR-600",
      "SYS-HLR-700"
    ],
    "text": "Persisted temperature values shall use Celsius as the canonical unit, with conversion to Fahrenheit performed at presentation only. This supports the user-selectable display units required by {Req 5.a} and {Req 5.c.i}, and the third-box display in {Req 4}. Temperatures shall be stored with fixed-point precision sufficient to cover the {Req 8.a} design range of −10 to +63 °C without rounding error affecting alert threshold comparisons. Application-created timestamps shall be stored in UTC. This is a team design decision rather than a spec-derived requirement {Req 5.c.iii} labels the graph axis in relative \"seconds ago\" and no wall-clock time is displayed. UTC is retained because local time is not monotonic across timezone transitions, and both the history index (**SWE-DB-LLR-552**) and the time-range replacement in **SWE-CONN-LLR-509** assume ordered timestamps.",
    "jira_summary": "SWE-DB-MLR-554 - Canonical Time and Units",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-534",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-CONN-LLR-500",
    "jira": "SCRUM-535",
    "level": "LLR",
    "component": "Computer BLE Connection Process",
    "status": "active",
    "parents": [
      "SWE-CONN-MLR-501"
    ],
    "text": "The BLE connection component shall start as an independent process/service with its own main loop and database connection.",
    "jira_summary": "SWE-CONN-LLR-500 - Connection Worker Executable",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-535",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-CONN-LLR-501",
    "jira": "SCRUM-536",
    "level": "LLR",
    "component": "Computer BLE Connection Process",
    "status": "active",
    "parents": [
      "SWE-CONN-MLR-502"
    ],
    "text": "The connection worker shall issue GET_CURRENT transactions at 1 Hz, scheduled against a monotonic clock so that sample spacing is unaffected by system time adjustments. Scheduled poll times shall not deviate by more than ±100 ms from one-second boundaries. Verification: log poll timestamps over 300 seconds and confirm the count is 300 ±1 and no interval exceeds the stated tolerance.",
    "jira_summary": "SWE-CONN-LLR-501 - One-Hertz Poll Scheduler",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-536",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-CONN-LLR-502",
    "jira": "SCRUM-537",
    "level": "LLR",
    "component": "Computer BLE Connection Process",
    "status": "active",
    "parents": [
      "SWE-CONN-MLR-502"
    ],
    "text": "For each valid GET_CURRENT response, the computer BLE connection worker shall store the received sensor temperatures, statuses, display states, boot identifier, and sample sequence number in the database. The worker shall also store the UTC response-receive time and the average temperature, calculated from the same sample when both sensor readings are valid.",
    "jira_summary": "SWE-CONN-LLR-502 - Successful Poll Persistence",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-537",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-CONN-LLR-503",
    "jira": "SCRUM-538",
    "level": "LLR",
    "component": "Computer BLE Connection Process",
    "status": "active",
    "parents": [
      "SWE-CONN-MLR-504"
    ],
    "text": "If a scheduled 1 Hz poll does not yield a valid reading, the worker shall persist a record for that one-second interval rather than repeating the previous value, so gaps remain distinguishable from valid data {Req 5.c.iv} and the graph continues scrolling {Req 5.c.v}. Missed-poll records shall be marked provisional, indicating an interval for which no third-box reading was obtained and which may be superseded if that data is later recovered. The worker cannot determine at poll time whether the box is powered off or merely unreachable, so no distinction is made when the record is written. Resolution of provisional records on reconnection is specified in **SWE-CONN-LLR-509**. Verification: interrupt the third-box connection during operation and confirm records continue to be written at 1 Hz marked provisional, with no value carried forward from the previous reading.",
    "jira_summary": "SWE-CONN-LLR-503 - Missing Poll Persistence",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-538",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-CONN-LLR-504",
    "jira": "SCRUM-539",
    "level": "LLR",
    "component": "Computer BLE Connection Process",
    "status": "active",
    "parents": [
      "SWE-CONN-MLR-506"
    ],
    "text": "After disconnection, the worker shall retry compatible-device discovery/connection frequently enough that a newly powered third box is detected within 10 seconds.",
    "jira_summary": "SWE-CONN-LLR-504 - Reconnect Retry Interval",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-539",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-CONN-LLR-505",
    "jira": "SCRUM-540",
    "level": "LLR",
    "component": "Computer BLE Connection Process",
    "status": "active",
    "parents": [
      "SWE-CONN-MLR-503"
    ],
    "text": "The worker shall initiate a history synchronization after first connection and after reconnecting to a new boot identifier.",
    "jira_summary": "SWE-CONN-LLR-505 - History Sync Trigger",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-540",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-CONN-LLR-506",
    "jira": "SCRUM-541",
    "level": "LLR",
    "component": "Computer BLE Connection Process",
    "status": "active",
    "parents": [
      "SWE-CONN-MLR-503"
    ],
    "text": "Before requesting history chunk data, the worker shall request history metadata from the third box, comprising: the boot/session identifier, the oldest and newest available sample sequence numbers, and the sample count available per sensor. The worker shall use this to determine which chunks are required rather than fetching blindly. If metadata cannot be obtained within [N] seconds, synchronization shall abort and retry rather than proceeding to chunk requests, so as not to exceed the 10-second startup budget in {Req 5.c}. Verification: initiate synchronization with a populated third-box buffer and confirm a metadata request precedes any chunk request, and that requested chunk ranges fall within the reported available range.",
    "jira_summary": "SWE-CONN-LLR-506 - History Metadata First",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-541",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-CONN-LLR-507",
    "jira": "SCRUM-542",
    "level": "LLR",
    "component": "Computer BLE Connection Process",
    "status": "active",
    "parents": [
      "SWE-CONN-MLR-503"
    ],
    "text": "Following metadata retrieval, the worker shall request history chunks until the most recent 300 seconds of available records have been obtained, or until the synchronization time budget is exhausted. The combined metadata and chunk-retrieval budget shall not exceed [N] seconds, preserving the 10-second startup requirement in {Req 5.c}. Individual chunk requests shall be retried up to 2 times on failure. If the budget expires before the full 300 seconds is retrieved, synchronization shall persist the records obtained and leave the remaining interval as a gap rather than discarding partial history; gaps remain distinguishable per {Req 5.c.iv}. Verification: initiate synchronization against a full third-box buffer and confirm 300 seconds of records are retrieved within the budget; repeat with an artificially delayed link and confirm partial history is persisted and the budget is not exceeded.",
    "jira_summary": "SWE-CONN-LLR-507 - History Chunk Loop",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-542",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-CONN-LLR-508",
    "jira": "SCRUM-543",
    "level": "LLR",
    "component": "Computer BLE Connection Process",
    "status": "active",
    "parents": [
      "SWE-CONN-MLR-503"
    ],
    "text": "For third-box records lacking absolute timestamps, the worker shall reconstruct observation times by anchoring the newest recovered sample to the time its response was received and assigning preceding samples at one-second intervals by descending sample sequence. Reconstructed timestamps are approximate; accumulated error across a 300-second recovery shall not exceed 2 seconds, consistent with the \"seconds ago\" axis labelling in {Req 5.c.iii}. Where a reconstructed timestamp overlaps an interval already covered by live polling, the live sample shall take precedence. Verification: recover a known-length history and confirm reconstructed timestamps are monotonically decreasing at one-second spacing, that the newest aligns with the first live sample without duplication or gap, and that total span matches the recovered sample count.",
    "jira_summary": "SWE-CONN-LLR-508 - History Timestamp Reconstruction",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-543",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-CONN-LLR-509",
    "jira": "SCRUM-544",
    "level": "LLR",
    "component": "Computer BLE Connection Process",
    "status": "active",
    "parents": [
      "SWE-CONN-MLR-503"
    ],
    "text": "On history synchronization, the worker shall upsert recovered samples keyed on device, boot, and sample identity so that repeated synchronization does not create duplicate records. Provisional records written by **SWE-CONN-LLR-503** carry no third-box sample sequence and shall be resolved by time range rather than by upsert: * If the recovered boot identity matches the session active before the gap, provisional records within the recovered range shall be replaced by the recovered samples. * If the boot identity differs, the third box was power-cycled and no data exists for the gap; provisional records preceding the new session's first sample shall be reclassified as no-data {Req 5.a.ii}. Verification: (a) synchronize history twice in succession and confirm record count is unchanged; (b) drop the connection with the box powered, reconnect, and confirm provisional records are replaced by recovered samples; (c) power-cycle the box and confirm provisional records for the off period become no-data.",
    "jira_summary": "SWE-CONN-LLR-509 - History De-Duplication",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-544",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-CONN-LLR-510",
    "jira": "SCRUM-545",
    "level": "LLR",
    "component": "Computer BLE Connection Process",
    "status": "active",
    "parents": [
      "SWE-CONN-MLR-505"
    ],
    "text": "The connection worker shall accept validated direct control requests from the backend API and schedule them promptly ahead of background history synchronization so the end-to-end display response can remain under 1 second. Verification: issue display toggles from the web UI across ten trials and measure browser-to-third-box response latency.",
    "jira_summary": "SWE-CONN-LLR-510 - Pending Command Poll",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-545",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-CONN-LLR-511",
    "jira": "SCRUM-546",
    "level": "LLR",
    "component": "Computer BLE Connection Process",
    "status": "active",
    "parents": [
      "SWE-CONN-MLR-505"
    ],
    "text": "The backend shall serialize each accepted direct display-control operation, execute it once through the BLE connection worker, and report success or failure to the caller. A connection loss or timeout shall produce an explicit failed result rather than leaving an operation indefinitely active. Verification: submit a command, confirm one BLE execution and a terminal response, then repeat with the third box unavailable and confirm failure is reported.",
    "jira_summary": "SWE-CONN-LLR-511 - Command Claiming",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-546",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-CONN-LLR-512",
    "jira": "SCRUM-547",
    "level": "LLR",
    "component": "Computer BLE Connection Process",
    "status": "active",
    "parents": [
      "SWE-CONN-MLR-505"
    ],
    "text": "After executing a direct remote display command, the backend shall return command success or failure and the resulting third-box display state through the backend API and diagnostic logs. Command completion is not required to be stored in MySQL.",
    "jira_summary": "SWE-CONN-LLR-512 - Command Completion",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-547",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-CONN-LLR-513",
    "jira": "SCRUM-548",
    "level": "LLR",
    "component": "Computer BLE Connection Process",
    "status": "active",
    "parents": [
      "SWE-CONN-MLR-506"
    ],
    "text": "The worker shall update a database device-state record with connected/unavailable state and last-seen time whenever BLE availability changes.",
    "jira_summary": "SWE-CONN-LLR-513 - Connection State Publication",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-548",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-CONN-LLR-514",
    "jira": "SCRUM-549",
    "level": "LLR",
    "component": "Computer BLE Connection Process",
    "status": "active",
    "parents": [
      "SWE-CONN-MLR-502"
    ],
    "text": "A BLE poll failure or database write failure shall be handled as an error for that cycle and shall not terminate the worker process without a controlled fatal condition.",
    "jira_summary": "SWE-CONN-LLR-514 - Polling Failure Isolation",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-549",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-DB-LLR-550",
    "jira": "SCRUM-550",
    "level": "LLR",
    "component": "MySQL Database",
    "status": "active",
    "parents": [
      "SWE-DB-MLR-551"
    ],
    "text": "Create a temperature_samples table containing device_id, boot_id, sample_seq, observed_at_utc, sensor1_c, sensor1_status, sensor2_c, sensor2_status, average_c, average_valid, and record_source fields.",
    "jira_summary": "SWE-DB-LLR-550 - temperature_samples Table",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-550",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-DB-LLR-551",
    "jira": "SCRUM-551",
    "level": "LLR",
    "component": "MySQL Database",
    "status": "active",
    "parents": [
      "SWE-DB-MLR-551"
    ],
    "text": "Re-inserting a temperature sample that has already been stored shall not create a duplicate record. Uniqueness shall be enforced by a database constraint on third-box device identity, session identity, and sample sequence extended to include series identity if series are stored as separate rows. Verification: attempt to insert a record matching an existing key and confirm the database rejects it without creating a second row.",
    "jira_summary": "SWE-DB-LLR-551 - Sample Uniqueness",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-551",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-DB-LLR-552",
    "jira": "SCRUM-552",
    "level": "LLR",
    "component": "MySQL Database",
    "status": "active",
    "parents": [
      "SWE-DB-MLR-551"
    ],
    "text": "The temperature_samples table shall carry an index on (device_id, observed_at_utc) supporting the two required access patterns: retrieval of the most recent sample per series and retrieval of all samples within a bounded time window of up to 300 seconds. If series are stored as separate rows, series identity shall be included in the index. Verification: EXPLAIN on both query forms shows the index in use rather than a full table scan.",
    "jira_summary": "SWE-DB-LLR-552 - History Index",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-552",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-DB-LLR-553",
    "jira": "SCRUM-553",
    "level": "LLR",
    "component": "MySQL Database",
    "status": "active",
    "parents": [
      "SWE-DB-MLR-550"
    ],
    "text": "Temperature samples shall be retained for a minimum of 300 seconds after the observed timestamp. Samples older than 600 seconds shall be eligible for automatic deletion. The retention floor shall exceed the maximum user-selectable graph window (300s) with margin sufficient to avoid contention between deletion and history queries.",
    "jira_summary": "SWE-DB-LLR-553 - Persistent Retention",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-553",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-DB-LLR-554",
    "jira": "SCRUM-554",
    "level": "LLR",
    "component": "MySQL Database",
    "status": "active",
    "parents": [
      "SWE-DB-MLR-552"
    ],
    "text": "The database schema shall not store application user accounts, passwords, password hashes, or USER/ADMIN roles. The application is operated as a trusted local tool and does not implement user accounts. Verification: inspect the schema and confirm no users or credential table is present.",
    "jira_summary": "SWE-DB-LLR-554 - users Table",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-554",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-DB-LLR-555",
    "jira": "SCRUM-555",
    "level": "LLR",
    "component": "MySQL Database",
    "status": "active",
    "parents": [
      "SWE-DB-MLR-552"
    ],
    "text": "Create an alert_recipients table storing an email destination address and enabled/configuration audit fields needed by the alerting implementation. The table shall support multiple email recipients. SMS recipients are out of scope. Verification: insert multiple email recipients and confirm all persist and are retrievable by alerting logic.",
    "jira_summary": "SWE-DB-LLR-555 - alert_recipients Table",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-555",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-DB-LLR-556",
    "jira": "SCRUM-556",
    "level": "LLR",
    "component": "MySQL Database",
    "status": "active",
    "parents": [
      "SWE-DB-MLR-552"
    ],
    "text": "Create an alert_rules table storing a minimum threshold, maximum threshold, high-temperature message, low-temperature message, and the monitored series, linked to one or more alert_recipients. Verification: create a rule with both thresholds and messages, confirm all five editable fields persist and are retrievable.",
    "jira_summary": "SWE-DB-LLR-556 - alert_rules Table",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-556",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-DB-LLR-557",
    "jira": "SCRUM-557",
    "level": "LLR",
    "component": "MySQL Database",
    "status": "active",
    "parents": [
      "SWE-DB-MLR-553"
    ],
    "text": "The database schema shall not require or create a control_commands table. Third-box display commands shall be validated and sent directly to the Python BLE backend. Verification: confirm the command table is absent and exercise a display request through the direct backend endpoint.",
    "jira_summary": "SWE-DB-LLR-557 - control_commands Table",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-557",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-DB-LLR-558",
    "jira": "SCRUM-558",
    "level": "LLR",
    "component": "MySQL Database",
    "status": "active",
    "parents": [
      "SWE-DB-MLR-553"
    ],
    "text": "Direct control operations shall return an explicit accepted/completed or failed result through the backend API, including timeout or unavailable-device failures. Database command states and expiry are not required because commands are not queued in MySQL. Verification: submit a command with the third box unavailable and confirm the API terminates with an actionable failure.",
    "jira_summary": "SWE-DB-LLR-558 - Command Status Values",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-558",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-DB-LLR-559",
    "jira": "SCRUM-559",
    "level": "LLR",
    "component": "MySQL Database",
    "status": "active",
    "parents": [
      "SWE-DB-MLR-554"
    ],
    "text": "All numeric threshold and temperature fields stored in MySQL shall use Celsius regardless of the user-selected display unit.",
    "jira_summary": "SWE-DB-LLR-559 - Celsius Storage",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-559",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-DB-LLR-560",
    "jira": "SCRUM-560",
    "level": "LLR",
    "component": "MySQL Database",
    "status": "active",
    "parents": [
      "SWE-DB-MLR-554"
    ],
    "text": "All timestamps stored in the database shall use UTC, including sample observation times and alert-configuration audit timestamps. This applies to application-generated timestamps and database defaults; the database server timezone shall be UTC. Conversion to local time is presentation-only.",
    "jira_summary": "SWE-DB-LLR-560 - UTC Timestamp Storage",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-560",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-DB-LLR-561",
    "jira": "SCRUM-561",
    "level": "LLR",
    "component": "MySQL Database",
    "status": "active",
    "parents": [
      "SWE-DB-MLR-550"
    ],
    "text": "Database credentials and secrets shall be supplied through environment/configuration outside version-controlled source files.",
    "jira_summary": "SWE-DB-LLR-561 - Database Credentials",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-561",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-WEB-MLR-600",
    "jira": "SCRUM-562",
    "level": "MLR",
    "component": "Web Application",
    "status": "active",
    "parents": [
      "SYS-HLR-110",
      "SYS-HLR-500"
    ],
    "text": "The computer shall host a web application/server that provides the browser UI and mediates access to database-backed temperature, configuration, and control functions.",
    "jira_summary": "SWE-WEB-MLR-600 - Computer-Hosted Web Application",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-562",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-WEB-MLR-601",
    "jira": "SCRUM-563",
    "level": "MLR",
    "component": "Web Application",
    "status": "active",
    "parents": [
      "SYS-HLR-500"
    ],
    "text": "The web UI shall obtain current temperature/status data from MySQL at a nominal 1 Hz rate.",
    "jira_summary": "SWE-WEB-MLR-601 - One-Hertz UI Data Refresh",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-563",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-WEB-MLR-602",
    "jira": "SCRUM-564",
    "level": "MLR",
    "component": "Web Application",
    "status": "active",
    "parents": [
      "SYS-HLR-500",
      "SYS-HLR-510",
      "SYS-HLR-700"
    ],
    "text": "The web application shall be usable on desktop and mobile displays. It is a trusted local application and shall not implement application user accounts or USER/ADMIN roles. Deployment shall restrict exposed services to the intended local host/network boundary.",
    "jira_summary": "SWE-WEB-MLR-602 - Responsive User/Admin Modes",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-564",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-WEB-MLR-603",
    "jira": "SCRUM-565",
    "level": "MLR",
    "component": "Web Application",
    "status": "active",
    "parents": [
      "SYS-HLR-700"
    ],
    "text": "The UI shall provide settings for configuring multiple email recipients and alert thresholds/messages. SMS configuration is out of scope.",
    "jira_summary": "SWE-WEB-MLR-603 - Settings Page",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-565",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-WEB-MLR-604",
    "jira": "SCRUM-566",
    "level": "MLR",
    "component": "Web Application",
    "status": "active",
    "parents": [
      "SYS-HLR-500",
      "SYS-HLR-600"
    ],
    "text": "The main view shall be a graph page supporting simultaneous selection of Sensor 1, Sensor 2, and Average series, with current values for selected series.",
    "jira_summary": "SWE-WEB-MLR-604 - Main Graph Page and Series Selection",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-566",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-WEB-MLR-605",
    "jira": "SCRUM-567",
    "level": "MLR",
    "component": "Web Application",
    "status": "active",
    "parents": [
      "SYS-HLR-500",
      "SYS-HLR-600"
    ],
    "text": "The web UI shall allow the user to display real-time and historical temperatures in Celsius or Fahrenheit.",
    "jira_summary": "SWE-WEB-MLR-605 - Celsius/Fahrenheit Presentation",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-567",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-WEB-MLR-606",
    "jira": "SCRUM-568",
    "level": "MLR",
    "component": "Web Application",
    "status": "active",
    "parents": [
      "SYS-HLR-500",
      "SYS-HLR-600"
    ],
    "text": "The UI shall distinguish disconnected sensors, unavailable third-box data, missing graph data, and valid off-scale graph data.",
    "jira_summary": "SWE-WEB-MLR-606 - Missing/Unavailable Presentation",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-568",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-WEB-MLR-607",
    "jira": "SCRUM-569",
    "level": "MLR",
    "component": "Web Application",
    "status": "active",
    "parents": [
      "SYS-HLR-510"
    ],
    "text": "The UI shall provide a local control page or section for remotely selecting the temperature information displayed on the third-box LCD. No application ADMIN account is required.",
    "jira_summary": "SWE-WEB-MLR-607 - Control Page",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-569",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-WEB-MLR-608",
    "jira": "SCRUM-570",
    "level": "MLR",
    "component": "Web Application",
    "status": "active",
    "parents": [
      "SYS-HLR-600"
    ],
    "text": "The stakeholder-required graph shall use fixed limits of 10 to 50 deg C or 50 to 122 deg F.",
    "jira_summary": "SWE-WEB-MLR-608 - Compliance Graph Y-Axis",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-570",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-WEB-MLR-609",
    "jira": "SCRUM-571",
    "level": "MLR",
    "component": "Web Application",
    "status": "conflict",
    "parents": [
      "SYS-HLR-600"
    ],
    "text": "The implementation design requests a configurable graph range within -10 to +63 deg C. This feature conflicts with the stakeholder requirement that the graph always use fixed 10 to 50 deg C limits and shall remain blocked until stakeholder approval or be implemented only as a separate non-required view.",
    "jira_summary": "SWE-WEB-MLR-609 - Configurable Graph Y-Axis",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-571",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-WEB-MLR-610",
    "jira": "SCRUM-572",
    "level": "MLR",
    "component": "Web Application",
    "status": "active",
    "parents": [
      "SYS-HLR-600"
    ],
    "text": "The stakeholder-required graph shall display a total time record of 300 seconds.",
    "jira_summary": "SWE-WEB-MLR-610 - Compliance Graph Time Window",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-572",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-WEB-MLR-611",
    "jira": "SCRUM-573",
    "level": "MLR",
    "component": "Web Application",
    "status": "conflict",
    "parents": [
      "SYS-HLR-600"
    ],
    "text": "The implementation design requests a selectable graph time range up to 300 seconds. This conflicts with the stakeholder statement that the total displayed record is 300 seconds and shall remain blocked until stakeholder approval or be implemented only as a separate non-required view.",
    "jira_summary": "SWE-WEB-MLR-611 - Configurable Graph Time Window",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-573",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-WEB-LLR-600",
    "jira": "SCRUM-574",
    "level": "LLR",
    "component": "Web Application",
    "status": "active",
    "parents": [
      "SWE-WEB-MLR-600"
    ],
    "text": "The web server shall provide a read-only API endpoint that returns the latest database-backed Sensor 1, Sensor 2, average, sensor-status, box-availability, and display-state data.",
    "jira_summary": "SWE-WEB-LLR-600 - Current Data API",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-574",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-WEB-LLR-601",
    "jira": "SCRUM-575",
    "level": "LLR",
    "component": "Web Application",
    "status": "active",
    "parents": [
      "SWE-WEB-MLR-600"
    ],
    "text": "The web server shall provide a read-only history endpoint accepting a requested duration up to the permitted limit and returning timestamped sensor/average values and status/missing markers.",
    "jira_summary": "SWE-WEB-LLR-601 - History API",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-575",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-WEB-LLR-602",
    "jira": "SCRUM-576",
    "level": "LLR",
    "component": "Web Application",
    "status": "active",
    "parents": [
      "SWE-WEB-MLR-607"
    ],
    "text": "The web/backend service shall provide an endpoint that validates a sensor display request and sends the corresponding command directly to the Python BLE backend. It shall not insert commands into MySQL and does not require application-user authentication in the trusted local deployment.",
    "jira_summary": "SWE-WEB-LLR-602 - Display Control API",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-576",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-WEB-LLR-603",
    "jira": "SCRUM-577",
    "level": "LLR",
    "component": "Web Application",
    "status": "active",
    "parents": [
      "SWE-WEB-MLR-607"
    ],
    "text": "The web/backend service shall expose the success, failure, timeout, and resulting display state of a submitted direct third-box control command through its API. No ADMIN authorization or database command-status record is required in the trusted local deployment.",
    "jira_summary": "SWE-WEB-LLR-603 - Command Status API",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-577",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-WEB-LLR-604",
    "jira": "SCRUM-578",
    "level": "LLR",
    "component": "Web Application",
    "status": "active",
    "parents": [
      "SWE-WEB-MLR-601"
    ],
    "text": "The graph/current-value client shall request current data from the web server every 1000 ms while the page is active.",
    "jira_summary": "SWE-WEB-LLR-604 - Browser Poll Timer",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-578",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-WEB-LLR-605",
    "jira": "SCRUM-579",
    "level": "LLR",
    "component": "Web Application",
    "status": "active",
    "parents": [
      "SWE-WEB-MLR-601"
    ],
    "text": "When the current API reports box unavailable or sensor invalid, the browser shall replace the prior numeric current value with the appropriate status text instead of retaining it as current.",
    "jira_summary": "SWE-WEB-LLR-605 - No Stale Current Value",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-579",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-WEB-LLR-606",
    "jira": "SCRUM-580",
    "level": "LLR",
    "component": "Web Application",
    "status": "active",
    "parents": [
      "SWE-WEB-MLR-602"
    ],
    "text": "The graph, current-value cards, settings forms, and control page shall use responsive layout rules that avoid horizontal overflow at common phone and desktop viewport widths.",
    "jira_summary": "SWE-WEB-LLR-606 - Responsive Layout",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-580",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-WEB-LLR-607",
    "jira": "SCRUM-581",
    "level": "LLR",
    "component": "Web Application",
    "status": "active",
    "parents": [
      "SWE-WEB-MLR-602"
    ],
    "text": "The application shall operate without application user accounts or USER/ADMIN roles. The operator is trusted by the local deployment boundary. Verification: confirm no login, user-role model, or account database is required for normal operation.",
    "jira_summary": "SWE-WEB-LLR-607 - Role Model",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-581",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-WEB-LLR-608",
    "jira": "SCRUM-582",
    "level": "LLR",
    "component": "Web Application",
    "status": "active",
    "parents": [
      "SWE-WEB-MLR-602"
    ],
    "text": "A local operator shall be permitted to view current temperatures and graphs, control the third-box displays, and configure email alerts. The application does not distinguish USER and ADMIN roles.",
    "jira_summary": "SWE-WEB-LLR-608 - User Permissions",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-582",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-WEB-LLR-609",
    "jira": "SCRUM-583",
    "level": "LLR",
    "component": "Web Application",
    "status": "active",
    "parents": [
      "SWE-WEB-MLR-602"
    ],
    "text": "A local operator shall be permitted to use third-box control and email notification/settings functions without an application ADMIN account.",
    "jira_summary": "SWE-WEB-LLR-609 - Admin Permissions",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-583",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-WEB-LLR-610",
    "jira": "SCRUM-584",
    "level": "LLR",
    "component": "Web Application",
    "status": "active",
    "parents": [
      "SWE-WEB-MLR-603"
    ],
    "text": "The settings page shall display all configured email recipients and allow the local operator to add, edit, enable/disable, and remove recipients. SMS recipients and ADMIN authorization are out of scope.",
    "jira_summary": "SWE-WEB-LLR-610 - Recipient List UI",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-584",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-WEB-LLR-611",
    "jira": "SCRUM-585",
    "level": "LLR",
    "component": "Web Application",
    "status": "active",
    "parents": [
      "SWE-WEB-MLR-603"
    ],
    "text": "The settings page shall allow the local operator to configure minimum and maximum Celsius-equivalent thresholds independently for each email alert recipient/rule.",
    "jira_summary": "SWE-WEB-LLR-611 - Per-Recipient Threshold UI",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-585",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-WEB-LLR-612",
    "jira": "SCRUM-586",
    "level": "LLR",
    "component": "Web Application",
    "status": "active",
    "parents": [
      "SWE-WEB-MLR-603"
    ],
    "text": "The settings page shall allow the local operator to edit the high-temperature and low-temperature message text associated with an email alert rule.",
    "jira_summary": "SWE-WEB-LLR-612 - Message Configuration UI",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-586",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-WEB-LLR-613",
    "jira": "SCRUM-587",
    "level": "LLR",
    "component": "Web Application",
    "status": "active",
    "parents": [
      "SWE-WEB-MLR-604"
    ],
    "text": "The graph page shall provide independent controls for displaying Sensor 1, Sensor 2, and Average, and shall permit any combination of the three.",
    "jira_summary": "SWE-WEB-LLR-613 - Series Toggle Controls",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-587",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-WEB-LLR-614",
    "jira": "SCRUM-588",
    "level": "LLR",
    "component": "Web Application",
    "status": "active",
    "parents": [
      "SWE-WEB-MLR-604"
    ],
    "text": "The graph page shall show a current-value indicator for each selected series and suppress or mark the average unavailable when one or both sensor readings are invalid.",
    "jira_summary": "SWE-WEB-LLR-614 - Selected Current Values",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-588",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-WEB-LLR-615",
    "jira": "SCRUM-589",
    "level": "LLR",
    "component": "Web Application",
    "status": "active",
    "parents": [
      "SWE-WEB-MLR-604"
    ],
    "text": "The web application shall calculate or read Average only from valid Sensor 1 and Sensor 2 values from the same sample record.",
    "jira_summary": "SWE-WEB-LLR-615 - Average Calculation Source",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-589",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-WEB-LLR-616",
    "jira": "SCRUM-590",
    "level": "LLR",
    "component": "Web Application",
    "status": "active",
    "parents": [
      "SWE-WEB-MLR-605"
    ],
    "text": "The web layer shall treat Celsius database values as canonical and convert to Fahrenheit using F = C * 9/5 + 32 for presentation.",
    "jira_summary": "SWE-WEB-LLR-616 - Canonical Conversion",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-590",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-WEB-LLR-617",
    "jira": "SCRUM-591",
    "level": "LLR",
    "component": "Web Application",
    "status": "active",
    "parents": [
      "SWE-WEB-MLR-605"
    ],
    "text": "Changing the unit selector shall update current-value labels, graph values, graph-axis labels, and configured threshold presentation without altering stored Celsius data.",
    "jira_summary": "SWE-WEB-LLR-617 - Unit Switch Refresh",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-591",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-WEB-LLR-618",
    "jira": "SCRUM-592",
    "level": "LLR",
    "component": "Web Application",
    "status": "active",
    "parents": [
      "SWE-WEB-MLR-606"
    ],
    "text": "For a disconnected sensor, the current-value UI shall display a textual indication of an unplugged sensor instead of a numeric temperature. I.E: “Sensor X Unplugged”",
    "jira_summary": "SWE-WEB-LLR-618 - Unplugged Sensor Text",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-592",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-WEB-LLR-619",
    "jira": "SCRUM-593",
    "level": "LLR",
    "component": "Web Application",
    "status": "active",
    "parents": [
      "SWE-WEB-MLR-606"
    ],
    "text": "When the third box is OFF/unavailable, the current-value UI shall display the exact text \"No data available\" instead of a numeric temperature.",
    "jira_summary": "SWE-WEB-LLR-619 - No Data Available Text",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-593",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-WEB-LLR-620",
    "jira": "SCRUM-594",
    "level": "LLR",
    "component": "Web Application",
    "status": "active",
    "parents": [
      "SWE-WEB-MLR-606"
    ],
    "text": "A missing/unavailable sample shall be rendered as a visible gap and/or dedicated missing marker and shall not be connected as if it were a valid temperature sample.",
    "jira_summary": "SWE-WEB-LLR-620 - Graph Missing Gap",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-594",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-WEB-LLR-621",
    "jira": "SCRUM-595",
    "level": "LLR",
    "component": "Web Application",
    "status": "active",
    "parents": [
      "SWE-WEB-MLR-606"
    ],
    "text": "A valid sample below/above the visible Y-axis shall be represented differently from a missing sample, for example by a boundary/clipped indicator while preserving its valid status.",
    "jira_summary": "SWE-WEB-LLR-621 - Off-Scale Marker",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-595",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-WEB-LLR-622",
    "jira": "SCRUM-596",
    "level": "LLR",
    "component": "Web Application",
    "status": "active",
    "parents": [
      "SWE-WEB-MLR-607"
    ],
    "text": "The control page shall provide independent local-operator controls for Sensor 1 and Sensor 2 LCD display-enable state.",
    "jira_summary": "SWE-WEB-LLR-622 - Sensor Display Controls",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-596",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-WEB-LLR-623",
    "jira": "SCRUM-597",
    "level": "LLR",
    "component": "Web Application",
    "status": "active",
    "parents": [
      "SWE-WEB-MLR-607"
    ],
    "text": "After submitting a display-control command, the control page shall update from the command result/current state rather than assuming the command succeeded.",
    "jira_summary": "SWE-WEB-LLR-623 - Control State Confirmation",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-597",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-WEB-LLR-624",
    "jira": "SCRUM-598",
    "level": "LLR",
    "component": "Web Application",
    "status": "active",
    "parents": [
      "SWE-WEB-MLR-608"
    ],
    "text": "In the stakeholder compliance graph, Celsius Y-axis minimum shall be 10 and maximum shall be 50.",
    "jira_summary": "SWE-WEB-LLR-624 - Fixed Celsius Axis",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-598",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-WEB-LLR-625",
    "jira": "SCRUM-599",
    "level": "LLR",
    "component": "Web Application",
    "status": "active",
    "parents": [
      "SWE-WEB-MLR-608"
    ],
    "text": "In the stakeholder compliance graph, Fahrenheit Y-axis minimum shall be 50 and maximum shall be 122.",
    "jira_summary": "SWE-WEB-LLR-625 - Fixed Fahrenheit Axis",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-599",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-WEB-LLR-626",
    "jira": "SCRUM-600",
    "level": "LLR",
    "component": "Web Application",
    "status": "active",
    "parents": [
      "SWE-WEB-MLR-610"
    ],
    "text": "The stakeholder compliance graph shall request/render 300 seconds of history and label the X-axis in seconds ago from 300 on the left to 0 on the right.",
    "jira_summary": "SWE-WEB-LLR-626 - 300-Second X Axis",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-600",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-WEB-LLR-627",
    "jira": "SCRUM-601",
    "level": "LLR",
    "component": "Web Application",
    "status": "conflict",
    "parents": [
      "SWE-WEB-MLR-609"
    ],
    "text": "If stakeholder approval is obtained for the design extension, an advanced/custom graph view may accept validated Celsius-equivalent Y-axis limits within -10 to +63 deg C and require min < max.",
    "jira_summary": "SWE-WEB-LLR-627 - Custom Y-Axis Control",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-601",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-WEB-LLR-628",
    "jira": "SCRUM-602",
    "level": "LLR",
    "component": "Web Application",
    "status": "conflict",
    "parents": [
      "SWE-WEB-MLR-611"
    ],
    "text": "If stakeholder approval is obtained for the design extension, an advanced/custom graph view may accept a time window greater than 0 and less than or equal to 300 seconds.",
    "jira_summary": "SWE-WEB-LLR-628 - Custom Time-Window Control",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-602",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-ALR-MLR-700",
    "jira": "SCRUM-603",
    "level": "MLR",
    "component": "Alerting/Security",
    "status": "active",
    "parents": [
      "SYS-HLR-700"
    ],
    "text": "The computer software shall support email alerts and shall allow multiple configurable email destinations. SMS alerts are out of scope.",
    "jira_summary": "SWE-ALR-MLR-700 - Email and SMS Delivery",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-603",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-ALR-MLR-701",
    "jira": "SCRUM-604",
    "level": "MLR",
    "component": "Alerting/Security",
    "status": "active",
    "parents": [
      "SYS-HLR-700"
    ],
    "text": "Each configured recipient shall support independently configurable high and low temperature thresholds.",
    "jira_summary": "SWE-ALR-MLR-701 - Per-Recipient Alert Rules",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-604",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-ALR-MLR-702",
    "jira": "SCRUM-605",
    "level": "MLR",
    "component": "Alerting/Security",
    "status": "active",
    "parents": [
      "SYS-HLR-700"
    ],
    "text": "The high-temperature and low-temperature alert message text shall be configurable from the computer UI.",
    "jira_summary": "SWE-ALR-MLR-702 - Configurable Alert Messages",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-605",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-ALR-MLR-703",
    "jira": "SCRUM-606",
    "level": "MLR",
    "component": "Alerting/Security",
    "status": "active",
    "parents": [
      "SYS-HLR-700"
    ],
    "text": "Notification delivery shall be performed by the computer through a configured third-party email service API or SMTP service rather than by the third box. SMS delivery is out of scope.",
    "jira_summary": "SWE-ALR-MLR-703 - Third-Party Notification Adapters",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-606",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-ALR-MLR-704",
    "jira": "SCRUM-607",
    "level": "MLR",
    "component": "Alerting/Security",
    "status": "active",
    "parents": [
      "SYS-HLR-700"
    ],
    "text": "Only valid current temperature measurements shall be evaluated against alert thresholds.",
    "jira_summary": "SWE-ALR-MLR-704 - Valid-Data Alert Evaluation",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-607",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-ALR-MLR-705",
    "jira": "SCRUM-608",
    "level": "MLR",
    "component": "Alerting/Security",
    "status": "tbd",
    "parents": [
      "SYS-HLR-700"
    ],
    "text": "The software shall avoid sending an alert every second while a temperature remains continuously out of range; an edge/episode-based notification policy shall be used unless the stakeholder specifies otherwise.",
    "jira_summary": "SWE-ALR-MLR-705 - Alert Repetition Policy",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-608",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-SEC-MLR-750",
    "jira": "SCRUM-609",
    "level": "MLR",
    "component": "Alerting/Security",
    "status": "active",
    "parents": [
      "SYS-HLR-510",
      "SYS-HLR-700"
    ],
    "text": "The web application shall not implement application user accounts, login, or role-based authorization. It shall be deployed as a trusted local tool with services bound to the documented local access boundary, while server-side validation remains mandatory for control and email-alert configuration inputs.",
    "jira_summary": "SWE-SEC-MLR-750 - Web Authentication and Authorization",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-609",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-ALR-LLR-700",
    "jira": "SCRUM-610",
    "level": "LLR",
    "component": "Alerting/Security",
    "status": "active",
    "parents": [
      "SWE-ALR-MLR-700"
    ],
    "text": "Each alert recipient record shall identify an email destination address. EMAIL is the only supported delivery type; SMS is out of scope.",
    "jira_summary": "SWE-ALR-LLR-700 - Recipient Types",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-610",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-ALR-LLR-701",
    "jira": "SCRUM-611",
    "level": "LLR",
    "component": "Alerting/Security",
    "status": "active",
    "parents": [
      "SWE-ALR-MLR-700"
    ],
    "text": "The alert evaluator shall process all enabled recipient/rule records applicable to a valid sample rather than stopping after the first matching recipient.",
    "jira_summary": "SWE-ALR-LLR-701 - Multiple Recipients",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-611",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-ALR-LLR-702",
    "jira": "SCRUM-612",
    "level": "LLR",
    "component": "Alerting/Security",
    "status": "active",
    "parents": [
      "SWE-ALR-MLR-701"
    ],
    "text": "Each alert rule shall contain minimum and maximum Celsius thresholds and a monitored source identifier.",
    "jira_summary": "SWE-ALR-LLR-702 - Threshold Rule Fields",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-612",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-ALR-LLR-703",
    "jira": "SCRUM-613",
    "level": "LLR",
    "component": "Alerting/Security",
    "status": "active",
    "parents": [
      "SWE-ALR-MLR-701"
    ],
    "text": "The alert evaluator shall compare each enabled recipient rule using that rule's own thresholds; one recipient's thresholds shall not alter another recipient's evaluation.",
    "jira_summary": "SWE-ALR-LLR-703 - Per-Recipient Evaluation",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-613",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-ALR-LLR-704",
    "jira": "SCRUM-614",
    "level": "LLR",
    "component": "Alerting/Security",
    "status": "active",
    "parents": [
      "SWE-ALR-MLR-702"
    ],
    "text": "A high-threshold notification shall use the configured high-message text for the matching rule/recipient.",
    "jira_summary": "SWE-ALR-LLR-704 - High Message Selection",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-614",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-ALR-LLR-705",
    "jira": "SCRUM-615",
    "level": "LLR",
    "component": "Alerting/Security",
    "status": "active",
    "parents": [
      "SWE-ALR-MLR-702"
    ],
    "text": "A low-threshold notification shall use the configured low-message text for the matching rule/recipient.",
    "jira_summary": "SWE-ALR-LLR-705 - Low Message Selection",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-615",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-ALR-LLR-706",
    "jira": "SCRUM-616",
    "level": "LLR",
    "component": "Alerting/Security",
    "status": "active",
    "parents": [
      "SWE-ALR-MLR-703"
    ],
    "text": "Implement an email provider adapter that accepts destination and message text and invokes the configured third-party email API or SMTP service using credentials supplied outside source control. The adapter shall support Gmail-compatible SMTP configuration for integration testing.",
    "jira_summary": "SWE-ALR-LLR-706 - SMS Provider Adapter",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-616",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-ALR-LLR-707",
    "jira": "SCRUM-617",
    "level": "LLR",
    "component": "Alerting/Security",
    "status": "active",
    "parents": [
      "SWE-ALR-MLR-703"
    ],
    "text": "Implement an email provider adapter that accepts destination and message text and invokes the configured third-party email API using credentials supplied outside source control.",
    "jira_summary": "SWE-ALR-LLR-707 - Email Provider Adapter",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-617",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-ALR-LLR-708",
    "jira": "SCRUM-618",
    "level": "LLR",
    "component": "Alerting/Security",
    "status": "active",
    "parents": [
      "SWE-ALR-MLR-703"
    ],
    "text": "A notification-provider failure shall be logged/recorded and shall not block subsequent one-second temperature polling.",
    "jira_summary": "SWE-ALR-LLR-708 - Provider Failure Handling",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-618",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-ALR-LLR-709",
    "jira": "SCRUM-619",
    "level": "LLR",
    "component": "Alerting/Security",
    "status": "active",
    "parents": [
      "SWE-ALR-MLR-704"
    ],
    "text": "The alert evaluator shall skip a sensor/rule evaluation when the underlying sample status is unavailable/disconnected/invalid.",
    "jira_summary": "SWE-ALR-LLR-709 - Invalid Sample Skip",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-619",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-ALR-LLR-710",
    "jira": "SCRUM-620",
    "level": "LLR",
    "component": "Alerting/Security",
    "status": "active",
    "parents": [
      "SWE-ALR-MLR-704"
    ],
    "text": "If Average is supported as an alert source, it shall be evaluated only when both Sensor 1 and Sensor 2 values in the same sample are valid.",
    "jira_summary": "SWE-ALR-LLR-710 - Average Alert Validity",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-620",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-ALR-LLR-711",
    "jira": "SCRUM-621",
    "level": "LLR",
    "component": "Alerting/Security",
    "status": "tbd",
    "parents": [
      "SWE-ALR-MLR-705"
    ],
    "text": "For each enabled recipient/rule/source combination, maintain alert state NORMAL, HIGH, or LOW.",
    "jira_summary": "SWE-ALR-LLR-711 - Alert Episode State",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-621",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-ALR-LLR-712",
    "jira": "SCRUM-622",
    "level": "LLR",
    "component": "Alerting/Security",
    "status": "tbd",
    "parents": [
      "SWE-ALR-MLR-705"
    ],
    "text": "Send the high alert only when the rule state transitions from NORMAL/LOW into HIGH; do not resend each one-second sample while it remains HIGH.",
    "jira_summary": "SWE-ALR-LLR-712 - High Edge Trigger",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-622",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-ALR-LLR-713",
    "jira": "SCRUM-623",
    "level": "LLR",
    "component": "Alerting/Security",
    "status": "tbd",
    "parents": [
      "SWE-ALR-MLR-705"
    ],
    "text": "Send the low alert only when the rule state transitions from NORMAL/HIGH into LOW; do not resend each one-second sample while it remains LOW.",
    "jira_summary": "SWE-ALR-LLR-713 - Low Edge Trigger",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-623",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-ALR-LLR-714",
    "jira": "SCRUM-624",
    "level": "LLR",
    "component": "Alerting/Security",
    "status": "tbd",
    "parents": [
      "SWE-ALR-MLR-705"
    ],
    "text": "Return the rule state to NORMAL when the valid temperature is between the configured minimum and maximum, allowing a later new excursion to generate another alert.",
    "jira_summary": "SWE-ALR-LLR-714 - Rearm In Range",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-624",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-SEC-LLR-750",
    "jira": "SCRUM-625",
    "level": "LLR",
    "component": "Alerting/Security",
    "status": "active",
    "parents": [
      "SWE-SEC-MLR-750"
    ],
    "text": "The application shall not store application-user credentials, plaintext passwords, or password hashes because application user accounts are out of scope. Service credentials, including email-provider credentials, shall be supplied outside source control.",
    "jira_summary": "SWE-SEC-LLR-750 - Password Hashing",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-625",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-SEC-LLR-751",
    "jira": "SCRUM-626",
    "level": "LLR",
    "component": "Alerting/Security",
    "status": "active",
    "parents": [
      "SWE-SEC-MLR-750"
    ],
    "text": "The trusted local deployment shall not require an application authenticated session or token for control/settings operations. Backend and frontend services shall be limited to the documented local access boundary.",
    "jira_summary": "SWE-SEC-LLR-751 - Authenticated Session",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-626",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-SEC-LLR-752",
    "jira": "SCRUM-627",
    "level": "LLR",
    "component": "Alerting/Security",
    "status": "active",
    "parents": [
      "SWE-SEC-MLR-750"
    ],
    "text": "Every third-box control and email-alert configuration API endpoint shall enforce server-side input validation independent of UI controls. Application ADMIN authorization is not required in the trusted local deployment.",
    "jira_summary": "SWE-SEC-LLR-752 - Server-Side Authorization",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-627",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-SEC-LLR-753",
    "jira": "SCRUM-628",
    "level": "LLR",
    "component": "Alerting/Security",
    "status": "active",
    "parents": [
      "SWE-SEC-MLR-750"
    ],
    "text": "The application shall not create authentication cookies because application login is out of scope. Any non-sensitive preference or session cookie that is used shall apply an appropriate SameSite setting and shall not contain credentials.",
    "jira_summary": "SWE-SEC-LLR-753 - Session Cookie Protection",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-628",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-SEC-LLR-754",
    "jira": "SCRUM-629",
    "level": "LLR",
    "component": "Alerting/Security",
    "status": "active",
    "parents": [
      "SWE-SEC-MLR-750"
    ],
    "text": "Server-side validation shall reject malformed email addresses, invalid threshold ordering, unsupported sensor identifiers, and out-of-range control values before persistence or command execution. Phone-number validation is out of scope.",
    "jira_summary": "SWE-SEC-LLR-754 - Input Validation",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-629",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-WEB-MLR-612",
    "jira": "SCRUM-630",
    "level": "MLR",
    "component": "Web Application",
    "status": "tbd",
    "parents": [
      "SYS-HLR-510"
    ],
    "text": "The implementation-decision phrase \"power states of the sensors (on/off)\" shall be interpreted as the third-box LCD display-enable state unless the team explicitly changes the hardware architecture; literal sensor power gating conflicts with continuous sensor acquisition and the stakeholder virtual-button requirement.",
    "jira_summary": "SWE-WEB-MLR-612 - Sensor ON/OFF Control Semantics",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-630",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-WEB-LLR-629",
    "jira": "SCRUM-631",
    "level": "LLR",
    "component": "Web Application",
    "status": "tbd",
    "parents": [
      "SWE-WEB-MLR-612"
    ],
    "text": "Until clarified otherwise, the control page sensor ON/OFF action shall submit SET_DISPLAY commands and shall not electrically power down the sensor.",
    "jira_summary": "SWE-WEB-LLR-629 - Remote Sensor Toggle Semantics",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-631",
    "jira_snapshot_status": "Approved",
    "source": "Atlassian Jira SCRUM read-only snapshot",
    "snapshot_date": "2026-09-22"
  },
  {
    "uid": "SWE-ALR-MLR-706",
    "jira": "SCRUM-632",
    "level": "MLR",
    "component": "Alerting/Security",
    "status": "tbd",
    "parents": [
      "SYS-HLR-700"
    ],
    "text": "The team shall define whether each recipient threshold applies to Sensor 1, Sensor 2, both sensors independently, and/or Average. The database and evaluator shall support an explicit monitored-source field so the choice is not implicit.",
    "jira_summary": "SWE-ALR-MLR-706 - Alert Source Scope",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-632",
    "jira_snapshot_status": "Approved",
