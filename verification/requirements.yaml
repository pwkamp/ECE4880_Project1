    "jira": "SCRUM-401",
    "level": "Project",
    "component": "System",
    "status": "active",
    "parents": [],
    "text": "The final system shall satisfy the applicable stakeholder requirements or document an approved stakeholder change for any deviation.",
    "jira_summary": "PRJ-REQ-003 - Requirements Compliance",
    "jira_url": "https://pkamp.atlassian.net/browse/SCRUM-401",
    "jira_snapshot_status": "Approved",
